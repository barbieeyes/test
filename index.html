<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>에코쌤즈 따로 또 같이</title>
<meta name="description" content="에코쌤즈 기후행동 실천모임 · 우리 지역 광합성 지도: 실시간 일사량·PAR 지수, 식물 AI 동정, 탄소 고정 잠재량 지도">
<meta name="theme-color" content="#2FA463">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/svg+xml" href="/icons/fav.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="manifest" href="/icons/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="에코쌤즈">
<meta name="application-name" content="에코쌤즈">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Share+Tech+Mono&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
  tailwind.config = {
    theme: { extend: {
      colors: {
        snow: "#1D3B2A", mist: "#5F7A68", photon: "#1E9E57", chloro: "#2FA463",
        amber: { DEFAULT: "#D98E04" }, line: "rgba(29,59,42,0.12)",
      },
      fontFamily: {
        display: ['"Jua"', '"IBM Plex Sans KR"', "system-ui", "sans-serif"],
        sans: ['"IBM Plex Sans KR"', "system-ui", "-apple-system", '"Apple SD Gothic Neo"', '"Malgun Gothic"', "sans-serif"],
        mono: ['"JetBrains Mono"', "ui-monospace", "SFMono-Regular", "Menlo", "monospace"],
      },
    } },
  };
</script>
<style>
/* 레이아웃: 포스터식 초록 격자 머리 그림(제목·부제 상자·캐릭터·언덕) → 흰 카드 대시보드 한 열. 단일 밝은 테마 */
:root{
  --grass:#2FA463; --grass-deep:#1E7F4A; --grass-ink:#1D3B2A; --lime:#C6DE3A; --leaf:#7CC242;
  --sun:#FFEB3B; --cream:#FFFBE6; --paper:#F6FAF2; --card:#FFFFFF; --mist:#5F7A68;
  --line:rgba(29,59,42,.12); --line-2:rgba(29,59,42,.2); --sky:#4FB7E8; --amber:#D98E04; --rose:#D9365A;
  --f-display:"Jua","IBM Plex Sans KR",system-ui,sans-serif;
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--paper);color:var(--grass-ink);font-family:var(--f-body);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.font-display{font-family:var(--f-display);font-weight:400;letter-spacing:.01em;text-wrap:balance}
.wrap{max-width:1080px;margin:0 auto;padding-top:18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--grass)}

/* ===== 포스터식 머리 그림 ===== */
.hero{position:relative;overflow:hidden;background-color:var(--grass);
  background-image:linear-gradient(rgba(255,255,255,.16) 1.5px,transparent 1.5px),linear-gradient(90deg,rgba(255,255,255,.16) 1.5px,transparent 1.5px);
  background-size:44px 44px;background-position:-1px -1px}
.hero-in{position:relative;z-index:2;max-width:1080px;margin:0 auto;text-align:center;
  padding-block:22px 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hero-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.hero-chip{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;background:rgba(255,255,255,.18);border:1.5px solid rgba(255,255,255,.45);
  color:#fff;font-size:12.5px;font-weight:600;letter-spacing:.02em}
.hero-title{font-family:var(--f-display);font-weight:400;margin:6px 0 0;line-height:1.08;font-size:clamp(38px,9.4vw,92px);letter-spacing:.01em;
  text-wrap:balance;text-shadow:0 4px 0 rgba(20,90,50,.35)}
.hero-title .y{color:var(--sun)} .hero-title .w{color:#fff} .hero-title span{white-space:nowrap}
.hero-sub{display:inline-block;margin-top:16px;background:var(--cream);color:var(--grass-deep);font-family:var(--f-display);
  font-size:clamp(17px,3.6vw,30px);padding:8px clamp(16px,4vw,34px);border:3px solid var(--grass-deep);box-shadow:7px 7px 0 rgba(255,255,255,.55);text-wrap:balance}
.hero-app{margin-top:12px;color:#fff;font-size:13px;font-weight:600;opacity:.95}
.hero-art{position:relative;z-index:1;display:block;width:100%;height:clamp(150px,27vw,330px);margin-top:-18px}
.hero-small .hero-title{font-size:clamp(30px,6.4vw,58px)} .hero-small .hero-sub{font-size:clamp(15px,2.8vw,22px);margin-top:12px}
.hero-small .hero-art{height:clamp(130px,20vw,240px)}

/* 사용자 바 */
.me-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--card);border:2px solid var(--grass);border-radius:16px;padding:9px 12px}
.me-name{font-family:var(--f-display);font-size:18px;color:var(--grass-deep)}
.icon-btn{width:36px;height:36px;display:grid;place-items:center;border-radius:11px;border:1.5px solid var(--line-2);background:#fff;color:var(--mist)}
.icon-btn:hover{color:var(--grass-deep);border-color:var(--grass)}

/* 카드와 섹션 머리표 (포스터의 초록 알약 제목) */
.glass{background:var(--card);border:1.5px solid var(--line);border-radius:20px;box-shadow:0 6px 18px rgba(30,127,74,.07);min-width:0}
.glass-2{background:#FBFDF7;border:1.5px solid var(--line);border-radius:16px}
.pill-h{display:inline-flex;align-items:center;gap:7px;background:var(--grass);color:#fff;font-family:var(--f-display);font-size:18px;
  padding:5px 16px 4px;border-radius:999px;box-shadow:0 3px 0 var(--grass-deep)}
.stat{background:#F3F8EC;border:1.5px solid rgba(124,194,66,.28);border-radius:14px;padding:9px 11px;min-width:0}
.lbl{font-size:11.5px;font-weight:700;letter-spacing:.06em;color:var(--grass-deep);margin-bottom:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;font-size:13px;color:var(--mist);border:1.5px solid var(--line-2);background:#fff}
.chip:hover{color:var(--grass-deep);border-color:var(--grass)}
.chip-on{color:#fff;border-color:var(--grass);background:var(--grass)}
.badge{display:inline-flex;align-items:center;padding:1px 9px;border-radius:999px;font-size:12px;font-family:var(--f-mono);border:1.5px solid var(--line-2);color:var(--mist);background:#fff}
.bar{height:8px;border-radius:99px;background:#E6EFDC;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--leaf),var(--grass));transition:width .6s ease}
.tax{display:inline-flex;gap:5px;padding:2px 9px;border-radius:8px;background:#F3F8EC;border:1px solid rgba(124,194,66,.35);color:var(--grass-ink)}
.tax b{font-weight:700;color:var(--grass)}
.carbon{border-radius:16px;padding:14px;border:2px solid var(--grass);background:linear-gradient(140deg,#EFF8E4,#FFFBE6)}
.glow{text-shadow:none}
.insight{border-radius:14px;padding:12px;background:#FFF8DB;border:1.5px solid #F2D45A}
.link-btn{display:inline-flex;align-items:center;gap:5px;color:var(--grass-deep);font-size:13px;font-weight:600}
.link-btn:hover{color:var(--grass)}

/* 지도 */
.mapbox{height:max(340px,54vh);border-radius:16px;overflow:hidden;border:2px solid var(--grass);background:#E8F1E0}
.leaflet-container{background:#E8F1E0;font-family:var(--f-body)}
.map-tools{position:absolute;top:10px;right:10px;z-index:500;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.tool{display:flex;align-items:center;gap:6px;padding:7px 11px;border-radius:11px;font-size:13px;font-weight:600;background:#fff;border:1.5px solid var(--line-2);color:var(--grass-ink);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.tool-on{color:#fff;background:var(--grass);border-color:var(--grass)}
.fab{position:absolute;bottom:34px;right:10px;z-index:500;display:flex;align-items:center;gap:7px;padding:11px 16px;border-radius:14px;font-family:var(--f-display);font-size:16px;
  color:var(--grass-ink);background:var(--sun);border:2.5px solid var(--grass-deep);box-shadow:4px 4px 0 var(--grass-deep)}
.legend{position:absolute;left:10px;bottom:34px;z-index:500;display:flex;gap:10px;flex-wrap:wrap;max-width:calc(100% - 210px);padding:6px 10px;border-radius:11px;font-size:12px;
  background:rgba(255,255,255,.95);border:1.5px solid var(--line-2);color:var(--grass-ink)}
.lg{width:10px;height:10px;border-radius:50%;display:inline-block}
.lg-high{background:#16A34A} .lg-mid{background:#84CC16} .lg-low{background:#F59E0B}
@media (max-width:560px){.legend{max-width:calc(100% - 20px);bottom:auto;top:10px;right:auto}.map-tools{top:auto;bottom:86px}}

/* 엽록소 펄스 마커 */
.pin{position:relative;display:block;width:28px;height:28px;--c:#84CC16}
.pin-high{--c:#16A34A} .pin-mid{--c:#84CC16} .pin-low{--c:#F59E0B}
.pin::before,.pin::after{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--rc,var(--c));opacity:.5;animation:pulse 2.4s ease-out infinite}
.pin::after{animation-delay:1.2s}
.pin-high::before,.pin-high::after{animation-duration:1.5s}
.pin-low::before,.pin-low::after{animation-duration:3.4s;opacity:.35}
.pin i{position:absolute;inset:7px;border-radius:50%;background:var(--rc,var(--c));box-shadow:0 0 6px rgba(0,0,0,.4)}
.pin b{position:absolute;inset:4px;border-radius:50%;border:2.5px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.5)}
.pin-sample{opacity:.6}
.pin-sel b{inset:1px;border-width:3px}
@keyframes pulse{0%{transform:scale(1);opacity:.5}100%{transform:scale(2.8);opacity:0}}
.me{position:relative;display:block;width:22px;height:22px}
.me::before{content:"";position:absolute;inset:0;border-radius:50%;background:rgba(79,183,232,.3);animation:pulse 2s ease-out infinite}
.me i{position:absolute;inset:5px;border-radius:50%;background:#2B9BD6;border:2.5px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3)}

/* 표 */
.row{background:#F8FBF4;cursor:pointer;transition:background .15s}
.row:hover,.row:focus-visible{background:#EAF5DF}

/* 모달 */
.modal-bg{position:fixed;inset:0;z-index:1000;background:rgba(20,50,32,.5);backdrop-filter:blur(3px);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;
  padding-block:max(24px,env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-bottom,0px));padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.modal{width:100%;max-width:680px;background:#fff;border:3px solid var(--grass);border-radius:22px;padding:18px;box-shadow:0 24px 60px rgba(20,60,35,.35)}
.drop{display:flex;flex-direction:column;align-items:center;gap:6px;padding:22px 10px;border-radius:16px;border:2px dashed var(--leaf);background:#F3F9EA;color:var(--grass-deep);font-size:14px;font-weight:600}
.drop:hover{background:#E8F4DA}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld>span{font-size:11.5px;font-weight:700;letter-spacing:.06em;color:var(--grass-deep)}
.fld input,.fld textarea{width:100%;background:#fff;border:1.5px solid var(--line-2);border-radius:12px;padding:9px 12px;color:var(--grass-ink);font:inherit;font-size:15px}
.fld input:focus,.fld textarea:focus{outline:none;border-color:var(--grass);box-shadow:0 0 0 3px rgba(47,164,99,.18)}
.btn-primary,.btn-save{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px 16px;border-radius:14px;font-size:15px;font-weight:700}
.btn-primary{color:var(--grass-deep);background:#EFF8E4;border:2px solid var(--grass)}
.btn-primary:hover:not(:disabled){background:#E3F2D3}
.btn-save{color:#fff;background:var(--grass);border:2px solid var(--grass-deep);box-shadow:0 4px 0 var(--grass-deep)}
.btn-save:active:not(:disabled){transform:translateY(2px);box-shadow:0 2px 0 var(--grass-deep)}
.btn-ghost{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:12px;border:1.5px solid var(--line-2);font-size:13px;font-weight:600;color:var(--grass-ink);background:#fff}
.btn-danger{padding:8px 12px;border-radius:12px;font-size:13px;font-weight:700;color:#fff;background:var(--rose)}
.err{font-size:13px;color:#9F1239;background:#FFF1F3;border:1.5px solid #FBC8D2;border-radius:12px;padding:9px 12px}
.exp{display:flex;align-items:center;gap:12px;text-align:left;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line-2);background:#fff;color:var(--grass-ink)}
.exp:hover:not(:disabled){border-color:var(--grass);background:#F3F9EA}
.exp b{display:block;font-size:14.5px} .exp small{display:block;color:var(--mist);font-size:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:1200;padding:10px 18px;border-radius:14px;
  background:var(--grass-ink);color:#fff;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:calc(100% - 32px)}
.boot{min-height:60vh;display:grid;place-items:center;color:var(--mist);font-size:14px;text-align:center;padding:24px}

/* 로그인 */
.gate{min-height:100vh;display:flex;flex-direction:column;background:var(--paper)}
.gate-card{width:100%;max-width:440px;margin:-8px auto 0;position:relative;z-index:3;background:#fff;border:3px solid var(--grass-deep);border-radius:24px;padding:20px;
  box-shadow:8px 8px 0 rgba(30,127,74,.25)}
.gate-card.shake{animation:shake .42s}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.who-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.who-b{display:flex;align-items:center;gap:8px;padding:11px 12px;border-radius:14px;border:2px solid var(--line-2);background:#fff;font-size:16px;font-weight:700;color:var(--grass-ink)}
.who-b:hover{border-color:var(--grass)}
.who-on{border-color:var(--grass);background:#EFF8E4;box-shadow:0 3px 0 var(--grass)}
.pin-in{width:100%;text-align:center;font-family:var(--f-mono);font-size:24px;letter-spacing:.6em;padding:11px 12px 11px calc(12px + .6em);border-radius:14px;border:2px solid var(--line-2);color:var(--grass-ink)}
.pin-in:focus{outline:none;border-color:var(--grass);box-shadow:0 0 0 3px rgba(47,164,99,.18)}
.gate-go{width:100%;padding:14px;border-radius:16px;font-family:var(--f-display);font-size:20px;color:var(--grass-ink);background:var(--sun);border:2.5px solid var(--grass-deep);box-shadow:0 4px 0 var(--grass-deep)}
.gate-go:active{transform:translateY(2px);box-shadow:0 2px 0 var(--grass-deep)}

/* ===== 따로 또 같이 ===== */
.hero-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.hero-me{display:inline-flex;align-items:center;gap:7px;padding:5px 12px;border-radius:999px;background:rgba(255,255,255,.2);border:1.5px solid rgba(255,255,255,.5);color:#fff;font-weight:700;font-size:13px}
.hero-motto{display:inline-flex;align-items:baseline;gap:8px;margin-top:14px;color:#fff;font-family:var(--f-display);font-size:clamp(18px,3.4vw,26px);flex-wrap:wrap;justify-content:center}
.hero-motto .m-solo{background:#2B9BD6;padding:2px 12px;border-radius:10px 2px 10px 2px;transform:rotate(-3deg);display:inline-block;box-shadow:3px 3px 0 #1C6E9C}
.hero-motto .m-team{background:var(--sun);color:var(--grass-deep);padding:2px 12px;border-radius:2px 10px 2px 10px;transform:rotate(3deg);display:inline-block;box-shadow:3px 3px 0 var(--grass-deep)}
.hero-motto .m-amp{opacity:.9}
.hero-motto .m-rest{font-family:var(--f-body);font-size:13px;font-weight:600;opacity:.95;flex-basis:100%;text-align:center}
.strip-btn{width:36px;height:36px;display:grid;place-items:center;border-radius:11px;background:rgba(255,255,255,.16);border:1.5px solid rgba(255,255,255,.45);color:#fff}
.strip-btn.on{background:var(--sun);color:var(--grass-deep);border-color:var(--sun)}
.strip{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background-color:var(--grass);
  background-image:linear-gradient(rgba(255,255,255,.14) 1.5px,transparent 1.5px),linear-gradient(90deg,rgba(255,255,255,.14) 1.5px,transparent 1.5px);background-size:32px 32px;
  border-bottom:4px solid var(--lime);box-shadow:0 4px 0 var(--leaf)}
.strip-in{max-width:1080px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.strip-team{color:#E9F7D8;font-size:12px;font-weight:600} .strip-team b{color:var(--sun);font-family:var(--f-display);font-weight:400;font-size:14px}
.strip-title{display:flex;align-items:center;gap:7px;color:#fff;font-family:var(--f-display);font-size:24px;line-height:1.1;white-space:nowrap}
.strip-title small{font-family:var(--f-body);font-size:12px;font-weight:600;color:#E9F7D8;overflow:hidden;text-overflow:ellipsis}
.strip-me{display:inline-flex;align-items:center;gap:6px;color:#fff;font-weight:700;font-size:13px;padding:0 4px}
@media (max-width:420px){.strip-me{display:none}.strip-title small{display:none}}
.tab-is-today .wrap{padding-top:14px}

/* 아래 탭 */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:900;display:grid;grid-template-columns:repeat(6,1fr);background:#fff;border-top:3px solid var(--grass);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);box-shadow:0 -6px 20px rgba(30,127,74,.12)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 9px;font-size:12px;font-weight:700;color:var(--mist);position:relative}
.tab-ic{position:relative;display:grid;place-items:center;width:44px;height:30px;border-radius:999px;transition:background .2s}
.tab-ic i{position:absolute;top:-4px;right:-2px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--sun);color:var(--grass-ink);font-style:normal;font-size:10.5px;line-height:18px;font-family:var(--f-mono);border:1.5px solid var(--grass-deep)}
.tab-on{color:var(--grass-deep)} .tab-on .tab-ic{background:#E3F3D6}
.tab-solo.tab-on{color:#1C6E9C} .tab-solo.tab-on .tab-ic{background:#DDF0FA}
.tab-archive.tab-on .tab-ic{background:#FFF3B0}
.tab-activity.tab-on{color:#B4600E} .tab-activity.tab-on .tab-ic{background:#FDE8D4}
@media (max-width:380px){.tab{font-size:11px}.tab-ic{width:38px}}
/* 활동 사진 */
.act-hero{display:flex;align-items:center;gap:14px;text-align:left;padding:16px;border-radius:20px;background:#E8862A;color:#fff;border:2.5px solid #B4600E;box-shadow:5px 5px 0 #B4600E}
.act-hero:active{transform:translate(2px,2px)}
.act-hero-ic{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;background:rgba(255,255,255,.2);flex:none}
.act-hero b{display:block;font-family:var(--f-display);font-weight:400;font-size:22px} .act-hero small{display:block;font-size:12.5px;opacity:.95;line-height:1.45}
.pill-act{background:#E8862A;box-shadow:0 3px 0 #B4600E}
.drop-act{border-color:#F0A35E;background:#FFF4EA;color:#B4600E}
.act-timeline{display:grid;gap:16px;border-left:3px dashed #F0A35E;padding-left:14px;margin-left:6px}
.act-day{position:relative;display:grid;gap:8px}
.act-day::before{content:"";position:absolute;left:-23px;top:4px;width:14px;height:14px;border-radius:50%;background:#E8862A;border:3px solid #fff;box-shadow:0 0 0 2px #E8862A}
.act-date{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap} .act-date span{font-size:15px;font-weight:700;color:#FF7A12} .act-date small{font-size:12.5px;color:var(--grass-ink);font-weight:600}
.act-thumbs{display:flex;gap:6px;overflow-x:auto;padding:2px} .act-thumbs img{width:54px;height:54px;object-fit:cover;border-radius:6px;flex:none;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.seg3-b.on.s-activity{background:#E8862A;box-shadow:0 2px 0 #B4600E}
.fld input[type=datetime-local]{font-family:var(--f-mono);font-size:16px}
/* 위치 콕 찍기 */
.pickwrap{position:relative}
.pickmap{height:min(46vh,340px);border-radius:14px;overflow:hidden;border:2px solid var(--grass);background:#2b3a2f}
.pick-read{position:absolute;right:8px;bottom:8px;z-index:500;background:rgba(0,0,0,.62);color:#fff;font-size:11px;padding:3px 8px;border-radius:8px;pointer-events:none}
.pick-pin{position:relative;display:block;width:34px;height:44px}
.pick-pin::before{content:"";position:absolute;left:3px;top:0;width:28px;height:28px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--c,#DC4B31);border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.45)}
.pick-pin i{position:absolute;left:12px;top:9px;width:10px;height:10px;border-radius:50%;background:#fff}
.pick-pin::after{content:"";position:absolute;left:15px;bottom:0;width:4px;height:4px;border-radius:50%;background:var(--c,#DC4B31);box-shadow:0 0 0 2px #fff}
.leaflet-control-layers{border-radius:12px!important;border:2px solid var(--grass)!important;font-family:var(--f-body);font-size:13px}
.leaflet-control-layers-expanded{padding:8px 10px!important}
.leaflet-control-scale-line{border-color:#fff!important;color:#fff;background:rgba(0,0,0,.45)!important;text-shadow:none}
.mapbox,.pickmap{background:#2b3a2f}

/* 오늘: 따로/같이 두 갈래 */
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.duo-b{position:relative;text-align:left;border-radius:20px;padding:14px 14px 16px;color:#fff;display:grid;gap:2px;overflow:hidden;min-height:132px;border:2.5px solid rgba(0,0,0,.18)}
.duo-solo{background:#2B9BD6;box-shadow:5px 5px 0 #1C6E9C;transform:rotate(-1deg)}
.duo-team{background:var(--grass);box-shadow:5px 5px 0 var(--grass-deep);transform:rotate(1deg)}
.duo-b:active{transform:translate(2px,2px)}
.duo-k{font-family:var(--f-display);font-size:34px;line-height:1;color:var(--sun)}
.duo-solo .duo-k{color:#fff;text-shadow:2px 2px 0 #1C6E9C}
.duo-b b{font-family:var(--f-display);font-weight:400;font-size:clamp(15px,4vw,19px);word-break:keep-all} .duo-b small{font-size:12px;opacity:.92}
.duo-go{position:absolute;right:10px;top:10px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.22)}
.duo-b::after{content:"";position:absolute;right:-26px;bottom:-26px;width:90px;height:90px;border-radius:50%;background:rgba(255,255,255,.12)}
.tally{display:flex;align-items:stretch;gap:6px}
.tally button{flex:1;display:grid;justify-items:center;gap:0;padding:10px 4px;border-radius:16px;background:#F3F8EC;border:1.5px solid rgba(124,194,66,.3)}
.tally button span{font-family:var(--f-display);font-size:16px;color:var(--grass-ink)} .tally b{font-size:26px;color:var(--grass-ink)} .tally small{font-size:11.5px;color:var(--mist)}
.tally-amp{align-self:center;font-family:var(--f-display);font-size:22px;color:var(--leaf)}
.strip-prints{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 10px}
.strip-prints .print{flex:0 0 120px}

/* 프레임 사진 */
.print{position:relative;display:block;width:100%;aspect-ratio:4/5;background:#FFFBEF;border-radius:4px;transform:rotate(var(--tilt,0deg));
  box-shadow:0 2px 0 rgba(0,0,0,.05),0 8px 16px rgba(40,70,40,.16);transition:transform .2s;overflow:hidden}
.print:hover{transform:rotate(0) scale(1.02)}
.print img{width:100%;height:100%;object-fit:cover;display:block}
.print-empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8%;text-align:center}
.print-ph{width:62%;aspect-ratio:1;display:grid;place-items:center;background:#E8F2DE;color:var(--leaf);margin-bottom:6px}
.print-empty b{font-family:var(--f-display);font-weight:400;font-size:15px;color:var(--grass-deep);line-height:1.15}
.print-empty small{font-size:10.5px;color:var(--mist)} .print-empty em{font-style:normal;color:#FF8A1E;font-size:12px}
.print-sample{position:absolute;top:6px;left:6px;font-size:10px;font-weight:700;color:#fff;background:var(--amber);border-radius:6px;padding:1px 6px}
.prints{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px 12px;padding:4px}
.prints-s{grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}

/* 따로: 네 갈래 */
.lanes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:640px){.lanes{grid-template-columns:repeat(2,minmax(0,1fr))}}
.lane{display:grid;gap:4px;text-align:left;padding:10px;border-radius:16px;background:#fff;border:2px solid var(--line-2);border-top:6px solid var(--c)}
.lane-on{border-color:var(--c);box-shadow:0 4px 0 var(--c)}
.lane-top{display:flex;align-items:center;gap:6px;font-size:14px} .lane-top em{font-style:normal;font-size:10px;font-weight:700;color:#fff;background:var(--c);border-radius:6px;padding:0 5px}
.lane-home{display:flex;align-items:center;gap:3px;font-size:11px;color:var(--mist);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lane-n{font-size:22px;color:var(--grass-ink);line-height:1} .lane-n small{font-size:11px;color:var(--mist);margin-left:3px;font-family:var(--f-body)}
.lane-thumbs{display:flex;gap:4px;min-height:30px}
.lane-thumbs img,.lane-thumbs i{width:30px;height:36px;border-radius:3px;object-fit:cover;background:#EEF5E6;display:grid;place-items:center;color:var(--leaf)}
.home-line{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:13px;color:var(--grass-ink);background:#EEF7FC;border:1.5px dashed #7CC0E6;border-radius:12px;padding:8px 10px}
.pill-solo{background:#2B9BD6;box-shadow:0 3px 0 #1C6E9C}
.btn-add{display:inline-flex;align-items:center;gap:5px;padding:7px 13px;border-radius:12px;font-family:var(--f-display);font-size:16px;color:#fff;background:var(--c);box-shadow:0 3px 0 rgba(0,0,0,.25)}
.empty-note{padding:22px 14px;border-radius:16px;border:2px dashed var(--line-2);color:var(--mist);text-align:center;font-size:13.5px;line-height:1.6;background:#FBFDF7}

/* 같이: 학교 표본함 */
.contrib{display:flex;gap:4px;height:34px}
.contrib span{flex-basis:0;min-width:64px;display:flex;align-items:center;justify-content:space-between;gap:4px;padding:0 9px;border-radius:9px;background:var(--c);color:#fff;font-family:var(--f-mono);font-size:13px}
.contrib b{font-family:var(--f-body);font-size:12px}
.herb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.herb{position:relative;background:#F4ECD8;border-radius:6px;padding:14px 14px 12px;transform:rotate(var(--tilt,0deg));box-shadow:0 10px 22px rgba(80,60,20,.16);
  background-image:radial-gradient(rgba(120,90,40,.07) 1px,transparent 1px);background-size:6px 6px}
.tape{position:absolute;top:-9px;left:50%;width:90px;height:22px;transform:translateX(-50%) rotate(-3deg);background:rgba(255,235,59,.75);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.herb-photo{display:block;width:100%;aspect-ratio:4/5;background:#FFFBEF;overflow:hidden;border-radius:3px;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.herb-photo img{width:100%;height:100%;object-fit:cover}
.herb-photo span{display:grid;place-items:center;height:100%;color:var(--leaf)}
.herb-label{margin-top:12px;background:#FFFEF8;border:1.5px solid #2B2B2B;padding:10px 12px;font-size:12.5px;color:#2B2B2B}
.herb-no{font-size:11px;letter-spacing:.06em;border-bottom:1px solid #2B2B2B;padding-bottom:4px;margin-bottom:6px}
.herb-name{font-family:var(--f-display);font-size:21px;line-height:1.1}
.herb-sci{font-style:italic;font-family:Georgia,"Times New Roman",serif;font-size:14px;margin-bottom:6px}
.herb-label dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:0}
.herb-label dt{color:#6B6B5A;font-size:11.5px} .herb-label dd{margin:0}

/* 지도 */
.seg3{display:flex;gap:4px;padding:4px;background:#EEF5E6;border-radius:14px}
.seg3-b{flex:1;padding:8px 6px;border-radius:10px;font-size:13.5px;font-weight:700;color:var(--mist);white-space:nowrap}
.seg3-b.on{background:var(--grass);color:#fff;box-shadow:0 2px 0 var(--grass-deep)}
.seg3-b.on.s-solo{background:#2B9BD6;box-shadow:0 2px 0 #1C6E9C}
.lg-solo{background:#fff;border:2.5px solid #2B9BD6} .lg-team{background:#fff;border:2.5px solid var(--grass);border-radius:3px!important}
.pin-team i{border-radius:4px} .pin-team b{border-radius:6px}
.pin-team::before,.pin-team::after{border-radius:6px}
.home-pin{position:absolute;transform:translate(-50%,-50%);display:inline-flex;align-items:center;gap:4px;white-space:nowrap;background:#fff;border:2px solid var(--c);color:var(--grass-ink);
  font-size:11px;font-weight:700;border-radius:999px;padding:2px 9px 2px 3px;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.home-pin i{font-style:normal;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:#fff;font-size:12px}
.rank{display:grid;gap:6px;max-height:min(52vh,520px);overflow-y:auto}
.rank-row{display:flex;align-items:center;gap:10px;padding:7px 9px;border-radius:12px;background:#F8FBF4;border:1.5px solid transparent;text-align:left}
.rank-row:hover{border-color:var(--leaf)}
.rank-i{width:22px;text-align:right;color:var(--mist);font-size:12px}
.rank-row img,.rank-ph{width:40px;height:50px;object-fit:cover;border-radius:3px;flex:none;background:#EEF5E6;display:grid;place-items:center;color:var(--leaf)}
.rank-row b{display:block;font-size:14px;color:var(--grass-ink)} .rank-row small{display:flex;align-items:center;gap:4px;font-size:11.5px;color:var(--mist);white-space:nowrap;overflow:hidden}
.mode-tag{display:inline-flex;align-items:center;padding:0 8px;border-radius:6px;border:2px solid;font-family:var(--f-display);font-size:14px;line-height:1.35;background:#fff}
.mode-tag-s{font-size:11px;padding:0 5px;border-width:1.5px}

/* 아카이브 */
.reel{display:grid;gap:0;border-radius:16px;overflow:hidden;background:#1F2A24;color:#fff;text-align:left;box-shadow:6px 6px 0 var(--grass)}
.reel-holes{height:16px;background-image:radial-gradient(circle at 50% 50%,#F6FAF2 4px,transparent 4.5px);background-size:22px 16px;background-repeat:repeat-x;background-position:6px 0}
.reel-body{display:flex;align-items:center;gap:12px;padding:12px 16px;color:var(--sun)}
.reel-body b{display:block;font-family:var(--f-display);font-weight:400;font-size:22px;color:#fff} .reel-body small{display:block;font-size:12.5px;color:#CFE6D6}
.day-h{display:flex;align-items:baseline;gap:8px;border-bottom:2px dashed var(--line-2);padding-bottom:4px}
.day-h span{font-size:15px;color:#FF7A12;font-weight:700} .day-h small{font-size:12px;color:var(--mist)}

/* 기록 창 */
.frame-prev{position:relative;max-width:360px;margin:0 auto;border-radius:6px;overflow:hidden;box-shadow:0 10px 24px rgba(0,0,0,.18);transform:rotate(-1deg);background:#FFFBEF;aspect-ratio:4/5}
.frame-prev img{width:100%;height:100%;object-fit:cover;display:block}
.frame-wait{display:grid;place-items:center;height:100%;color:var(--mist)}
.detail-photo{display:block;width:100%;max-width:420px;margin:0 auto 12px;border-radius:6px;box-shadow:0 10px 24px rgba(0,0,0,.18)}
.loc-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:12px;background:#F3F8EC;font-size:12.5px;color:var(--grass-ink)}
.mini-btn{display:inline-flex;align-items:center;gap:4px;padding:4px 9px;border-radius:9px;background:#fff;border:1.5px solid var(--line-2);font-size:12px;font-weight:700;color:var(--grass-deep)}
.who-b small{font-size:11px;font-weight:600;color:var(--mist)}
.pb-28{padding-bottom:112px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ---- 언제나 위: 이동 막대 ---- */
.strip-in{justify-content:flex-start}
.nav-btn{display:inline-flex;align-items:center;gap:2px;height:38px;padding:0 10px 0 4px;border-radius:12px;background:rgba(255,255,255,.16);border:1.5px solid rgba(255,255,255,.45);color:#fff;font-weight:700;font-size:13px;flex:none}
.nav-btn:disabled{opacity:.35}
.nav-logo{display:grid;text-align:left;min-width:0;flex:0 1 auto;padding:2px 4px;border-radius:10px}
.nav-logo:active{background:rgba(255,255,255,.12)}
.nav-logo .strip-title{overflow:hidden}
.nav-me{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 10px;border-radius:999px;background:#fff;color:var(--grass-deep);font-weight:700;font-size:13px;border:2px solid var(--sun);flex:none}
.nav-out{display:inline-flex;align-items:center;gap:5px;height:38px;padding:0 11px;border-radius:12px;background:rgba(0,0,0,.18);border:1.5px solid rgba(255,255,255,.45);color:#fff;font-weight:700;font-size:13px;flex:none}
@media (max-width:560px){.nav-lbl{display:none}.nav-btn{padding:0 6px 0 4px}.nav-out{padding:0 9px}.strip-title{font-size:20px}.strip-team{font-size:11px}}
@media (max-width:420px){.nav-logo .strip-team{font-size:0}.nav-logo .strip-team b{font-size:13px}.nav-me{padding:0 8px;gap:4px}}
@media (max-width:360px){.nav-me span{max-width:3.2em;overflow:hidden;white-space:nowrap}}
/* ---- 협의회 ---- */
.seg3-b.on.s-meeting{background:#9A6A2F;box-shadow:0 2px 0 #6E4A1E;color:#fff}
.meet-hero{background:#9A6A2F;border-color:#6E4A1E;box-shadow:5px 5px 0 #6E4A1E}
.meet-list{display:grid;gap:12px}
.minutes{display:flex;gap:0;text-align:left;border-radius:16px;background:#FFFCF5;border:2px solid #E4D3B8;box-shadow:0 3px 0 #E4D3B8;overflow:hidden;
  background-image:repeating-linear-gradient(#FFFCF5 0 25px,#F1E6D3 25px 26px)}
.minutes:active{transform:translateY(2px);box-shadow:0 1px 0 #E4D3B8}
.minutes-date{flex:0 0 74px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;background:#9A6A2F;color:#fff;padding:12px 4px}
.minutes-date b{font-size:22px;line-height:1} .minutes-date small{font-size:10.5px;opacity:.9} .minutes-date em{font-style:normal;font-size:11px;margin-top:4px;padding:1px 6px;border-radius:6px;background:rgba(255,255,255,.2)}
.minutes-body{flex:1;min-width:0;display:grid;gap:5px;padding:11px 13px}
.minutes-no{font-size:10.5px;color:#9A6A2F;letter-spacing:.04em}
.minutes-body>b{font-family:var(--f-display);font-weight:400;font-size:18px;color:#3E2A12;line-height:1.25}
.minutes-who{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;font-weight:600;color:#5B4630}
.minutes-who span{display:inline-flex;align-items:center;gap:4px}
.minutes-text{font-size:13px;color:#4A3B2A;line-height:1.6;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}
.minutes-dec{display:flex;gap:5px;align-items:flex-start;font-size:12.5px;font-weight:600;color:#1E7A43;background:#EEF8E8;border-radius:8px;padding:5px 8px;white-space:pre-line}
.minutes-dec svg{flex:none;margin-top:2px}
.minutes-ph{display:flex;gap:5px;align-items:center}
.minutes-ph img{width:46px;height:46px;object-fit:cover;border-radius:7px;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.minutes-ph i{font-style:normal;font-size:12px;font-weight:700;color:#9A6A2F}
.minutes-form .fld>span{color:#6E4A1E}
.minutes-form textarea{line-height:1.6;resize:vertical}
.drop-meet{border-color:#C9A36E;background:#FBF4E8;color:#6E4A1E}
.meet-photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.meet-ph{position:relative;display:block}
.meet-ph img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:10px;border:2px solid #E4D3B8}
.meet-ph button{position:absolute;top:4px;right:4px;width:24px;height:24px;display:grid;place-items:center;border-radius:999px;background:rgba(0,0,0,.6);color:#fff}

/* ---- 협의회 녹음 ---- */
.rec-box{display:grid;gap:10px;padding:14px;border-radius:18px;background:#FBF4E8;border:2px solid #E4D3B8}
.rec-box.live{background:#FFF1EE;border-color:#F3A99B;box-shadow:0 0 0 4px rgba(220,75,49,.12)}
.rec-btn{display:inline-flex;align-items:center;gap:8px;height:48px;padding:0 18px;border-radius:999px;background:#DC4B31;color:#fff;font-weight:800;font-size:16px;border:2px solid #A8321D;box-shadow:0 4px 0 #A8321D}
.rec-btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 2px 0 #A8321D}
.rec-btn.stop{background:#3E2A12;border-color:#1F150A;box-shadow:0 4px 0 #1F150A}
.rec-btn:disabled{opacity:.5}
.rec-sq{width:14px;height:14px;border-radius:3px;background:#fff}
.rec-time{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:#6E4A1E}
.rec-dot{width:10px;height:10px;border-radius:99px;background:#DC4B31;animation:recblink 1s infinite}
@keyframes recblink{50%{opacity:.2}}
@media (prefers-reduced-motion:reduce){.rec-dot{animation:none}}
.rec-sum{margin-left:auto;display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 16px;border-radius:14px;background:#9A6A2F;color:#fff;font-weight:800;font-size:15px;border:2px solid #6E4A1E;box-shadow:0 3px 0 #6E4A1E}
.rec-sum:disabled{opacity:.45;box-shadow:none}
.rec-help{font-size:12.5px;color:#6E4A1E;line-height:1.6}
.rec-tr summary{cursor:pointer;font-size:12.5px;font-weight:700;color:#6E4A1E;padding:2px 0}
.rec-tr textarea{margin-top:6px;width:100%;background:#fff;border:1.5px solid #E4D3B8;border-radius:12px;padding:9px 12px;font-size:14px;line-height:1.65;color:var(--grass-ink);resize:vertical}
.ok-note{font-size:13px;color:#1E7A43;background:#EEF8E8;border:1.5px solid #BFE3C6;border-radius:12px;padding:9px 12px}
.minutes-todo{display:flex;gap:5px;align-items:flex-start;font-size:12.5px;font-weight:600;color:#6E4A1E;background:#FBF0DD;border-radius:8px;padding:5px 8px;white-space:pre-line}
.minutes-todo svg{flex:none;margin-top:2px}
.team-ai{display:flex;gap:9px;align-items:flex-start;padding:10px 12px;border-radius:14px;background:#FFF7E0;border:1.5px solid #F2D27A;color:#7A5A00;margin-bottom:10px}
.team-ai.on{background:#EEF8E8;border-color:#BFE3C6;color:#1E7A43}
.team-ai svg{flex:none;margin-top:2px} .team-ai b{display:block;font-size:14px} .team-ai small{display:block;font-size:12px;opacity:.9;line-height:1.5}
.all-in-one{display:flex;align-items:center;gap:14px;text-align:left;padding:14px 16px;border-radius:18px;background:var(--grass);color:#fff;border:2.5px solid var(--grass-deep);box-shadow:4px 4px 0 var(--grass-deep)}
.all-in-one:active:not(:disabled){transform:translate(2px,2px);box-shadow:2px 2px 0 var(--grass-deep)}

<script>
/* ===== 광합성 추정 모델 (투명하게 공개하는 계산식) =====
 * 1) 광합성유효광량자속밀도 PPFD(µmol/m²/s) ≈ 전천일사량 SW(W/m²) × 0.45(PAR 비율) × 4.57(µmol/J)
 * 2) 잎 단위 순광합성 A = [α·I·Amax / (α·I + Amax)] × f(T) × f(VPD) − Rd   (직각쌍곡선 광반응곡선)
 * 3) 군락 단위: 유효 엽면적 = (1 − e^(−k·LAI)) / k  (Beer 법칙, k = 0.5)
 * 4) g CO₂/h·m² = A(µmol/m²/s) × 3600 × 44.01×10⁻⁶
 * 계수는 교과·문헌의 대표값이며, 현장 측정값이 아닌 '추정치'입니다.
 */
(function (root) {
  const PS_TYPES = {
    C3:  { label: "C₃",  amax: 22, alpha: 0.05,  topt: 25, rdFrac: 0.06, vpdSensitive: true,
           note: "대부분의 식물. 강광·고온에서 광호흡으로 효율이 떨어져요." },
    C4:  { label: "C₄",  amax: 38, alpha: 0.065, topt: 33, rdFrac: 0.05, vpdSensitive: true,
           note: "옥수수·강아지풀 등. 강광·고온에서 효율이 높아요." },
    CAM: { label: "CAM", amax: 3,  alpha: 0.03,  topt: 30, rdFrac: 0.10, vpdSensitive: false,
           note: "다육식물 등. 낮에는 기공을 닫고 밤에 CO₂를 고정해요(낮 값은 매우 작음)." },
  };
  const FORMS = {
    "목본":     { amaxScale: 1.0,  lai: 4.0 },
    "초본":     { amaxScale: 1.0,  lai: 2.5 },
    "양치식물": { amaxScale: 0.45, lai: 1.5 },
    "이끼류":   { amaxScale: 0.2,  lai: 1.0 },
  };
  const K_EXT = 0.5;
  const G_PER_UMOL_HOUR = 3600 * 44.01e-6; // = 0.158436

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const num = (v, d) => (typeof v === "number" && isFinite(v) ? v : d);

  function ppfdFromSW(sw) { return Math.max(0, num(sw, 0)) * 0.45 * 4.57; }
  function parIndex(ppfd) { return Math.round(clamp(num(ppfd, 0) / 2000 * 100, 0, 100)); }
  function activity(ppfd) {
    const p = num(ppfd, 0);
    if (p >= 800) return { key: "high", label: "활발" };
    if (p >= 200) return { key: "mid", label: "보통" };
    return { key: "low", label: "음지" };
  }
  function vpdKPa(tempC, rh) {
    const es = 0.6108 * Math.exp((17.27 * tempC) / (tempC + 237.3));
    return Math.max(0, es * (1 - clamp(num(rh, 60), 0, 100) / 100));
  }

  /** 기상값 + 식물 정보 → 추정 광합성 속도·탄소 고정 잠재량 */
  function estimate({ sw, temp, rh, psType = "C3", growthForm = "초본", lai }) {
    const P = PS_TYPES[psType] || PS_TYPES.C3;
    const F = FORMS[growthForm] || FORMS["초본"];
    const T = num(temp, 20);
    const I = ppfdFromSW(sw);
    const amax = P.amax * F.amaxScale;
    const fT = Math.exp(-Math.pow((T - P.topt) / 12, 2));
    const vpd = vpdKPa(T, rh);
    const fVPD = P.vpdSensitive ? (vpd <= 1 ? 1 : clamp(1 - (vpd - 1) * 0.35, 0.3, 1)) : 1;
    const gross = I > 0 ? (P.alpha * I * amax) / (P.alpha * I + amax) : 0;
    const rd = P.rdFrac * amax * fT;
    const aLeaf = Math.max(0, gross * fT * fVPD - rd); // µmol CO₂/m²(잎)/s
    const L = clamp(num(lai, F.lai), 0.1, 10);
    const effLeaf = (1 - Math.exp(-K_EXT * L)) / K_EXT;
    const aCanopy = aLeaf * effLeaf;                     // µmol CO₂/m²(지면)/s
    const gco2 = aCanopy * G_PER_UMOL_HOUR;             // g CO₂/h·m²(지면)
    return {
      ppfd: Math.round(I), aLeaf: +aLeaf.toFixed(2), aCanopy: +aCanopy.toFixed(2),
      gco2: +gco2.toFixed(2), lai: +L.toFixed(1), effLeaf: +effLeaf.toFixed(2),
      fT: +fT.toFixed(2), fVPD: +fVPD.toFixed(2), vpd: +vpd.toFixed(2), amax: +amax.toFixed(1),
    };
  }

  root.PSModel = { PS_TYPES, FORMS, ppfdFromSW, parIndex, activity, vpdKPa, estimate, clamp };
  if (typeof module !== "undefined") module.exports = root.PSModel;
})(typeof window !== "undefined" ? window : globalThis);

</script>
<script>
/* ===== 사진 프레임 & 아카이브 영상 (캔버스) ===== */
(function (root) {
  const TEAM = "기후행동 실천모임 에코쌤즈";
  const MODE_INFO = {
    solo: { label: "따로", place: "우리 동네", color: "#2B9BD6", deep: "#1C6E9C" },
    team: { label: "같이", place: "학교", color: "#1E9E57", deep: "#16713E" },
    activity: { label: "활동", place: "", color: "#E8862A", deep: "#B4600E" },
    meeting: { label: "협의", place: "", color: "#9A6A2F", deep: "#6E4A1E" },
  };
  const FONT_DISPLAY = '"Jua", "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif';
  const FONT_BODY = '"IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif';
  const FONT_STAMP = '"Share Tech Mono", "JetBrains Mono", ui-monospace, monospace';

  function loadImg(src) {
    return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
  }
  async function fontsReady() {
    try {
      if (!document.fonts) return;
      await Promise.race([
        Promise.all([document.fonts.load('48px "Jua"'), document.fonts.load('40px "Share Tech Mono"'), document.fonts.load('24px "IBM Plex Sans KR"')]),
        new Promise((r) => setTimeout(r, 1500)),
      ]);
    } catch (e) {}
  }
  function cover(ctx, img, x, y, w, h) {
    const s = Math.max(w / img.width, h / img.height);
    const sw = w / s, sh = h / s, sx = (img.width - sw) / 2, sy = (img.height - sh) / 2;
    ctx.drawImage(img, sx, sy, sw, sh, x, y, w, h);
  }
  function fitText(ctx, text, maxW, font, startPx, minPx) {
    let px = startPx;
    for (; px > minPx; px -= 2) { ctx.font = font.replace("{px}", px); if (ctx.measureText(text).width <= maxW) return px; }
    ctx.font = font.replace("{px}", minPx);
    let t = text; while (t.length > 1 && ctx.measureText(t + "…").width > maxW) t = t.slice(0, -1);
    return t === text ? minPx : { px: minPx, text: t + "…" };
  }
  function stampDate(ts) {
    const d = new Date(ts), p = (n) => String(n).padStart(2, "0");
    return `'${String(d.getFullYear()).slice(2)} ${p(d.getMonth() + 1)} ${p(d.getDate())}`;
  }
  function dotDate(ts) {
    const d = new Date(ts), p = (n) => String(n).padStart(2, "0");
    return `${d.getFullYear()}.${p(d.getMonth() + 1)}.${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
  }

  /** 촬영 사진 → 팀 이름·날짜 도장이 찍힌 폴라로이드 프레임 (900×1125 JPEG) */
  async function composeFrame(rawDataUrl, meta) {
    await fontsReady();
    const img = await loadImg(rawDataUrl);
    const W = 900, H = 1125, P = 36, PH = 828;
    const M = MODE_INFO[meta.mode] || MODE_INFO.team;
    const c = document.createElement("canvas"); c.width = W; c.height = H;
    const g = c.getContext("2d");
    g.fillStyle = "#FFFBEF"; g.fillRect(0, 0, W, H);
    // 종이 결
    g.globalAlpha = 0.05; g.fillStyle = "#7A6A3A";
    for (let i = 0; i < 260; i++) g.fillRect((i * 97) % W, (i * 53) % H, 2, 2);
    g.globalAlpha = 1;
    cover(g, img, P, P, PH, PH);
    g.strokeStyle = "rgba(0,0,0,.12)"; g.lineWidth = 2; g.strokeRect(P, P, PH, PH);
    // 필름 카메라 날짜 도장
    g.save(); g.font = `52px ${FONT_STAMP}`; g.textAlign = "right"; g.textBaseline = "alphabetic";
    g.shadowColor = "rgba(255,110,0,.85)"; g.shadowBlur = 12; g.fillStyle = "#FF8A1E";
    g.fillText(stampDate(meta.ts), P + PH - 26, P + PH - 26);
    g.shadowBlur = 0; g.fillStyle = "rgba(255,190,90,.55)"; g.fillText(stampDate(meta.ts), P + PH - 26, P + PH - 26);
    g.restore();
    // 아래 띠: 이름·학명·팀
    const bx = P + 6, textW = W - P * 2 - 190;
    const name = meta.name || (meta.mode === "meeting" ? "에코쌤즈 협의회" : meta.mode === "activity" ? "우리의 활동" : "이름을 찾는 중인 식물");
    g.fillStyle = "#1E5E38"; g.textBaseline = "alphabetic";
    const fn = fitText(g, name, textW, `{px}px ${FONT_DISPLAY}`, 58, 34);
    if (typeof fn === "object") { g.font = `${fn.px}px ${FONT_DISPLAY}`; g.fillText(fn.text, bx, 935); } else g.fillText(name, bx, 935);
    g.fillStyle = "#5F7A68";
    if (meta.sci) { g.font = `italic 27px ${FONT_BODY}`; const s2 = fitText(g, meta.sci, textW, `italic {px}px ${FONT_BODY}`, 27, 20);
      g.fillText(typeof s2 === "object" ? s2.text : meta.sci, bx, 978); }
    g.font = `22px ${FONT_BODY}`; g.fillStyle = "#3D5A48";
    const group = meta.mode === "activity" || meta.mode === "meeting";
    const line3 = group
      ? [meta.people && meta.people.length ? "함께 " + meta.people.join("·") : meta.researcher, meta.place, dotDate(meta.ts)].filter(Boolean).join(" · ")
      : `${M.label} · ${meta.researcher} · ${meta.place || M.place} · ${dotDate(meta.ts)}`;
    const l3 = fitText(g, line3, textW, `{px}px ${FONT_BODY}`, 22, 16);
    g.fillText(typeof l3 === "object" ? l3.text : line3, bx, 1020);
    g.font = `26px ${FONT_DISPLAY}`; g.fillStyle = M.deep; g.fillText(TEAM, bx, 1068);
    // 고무 도장 (따로 / 같이)
    g.save(); g.translate(W - 118, 985); g.rotate(-0.21);
    g.strokeStyle = M.color; g.fillStyle = M.color; g.globalAlpha = 0.9; g.lineWidth = 5;
    g.beginPath(); g.arc(0, 0, 70, 0, Math.PI * 2); g.stroke();
    g.lineWidth = 2; g.beginPath(); g.arc(0, 0, 60, 0, Math.PI * 2); g.stroke();
    g.textAlign = "center"; g.font = `46px ${FONT_DISPLAY}`; g.fillText(M.label, 0, 10);
    g.font = `17px ${FONT_BODY}`; g.fillText("에코쌤즈", 0, -30); g.fillText(group ? "기후행동" : (meta.researcher || ""), 0, 42);
    g.restore();
    // 맨 아래 색띠
    g.fillStyle = M.color; g.fillRect(0, H - 14, W, 14);
    return c.toDataURL("image/jpeg", 0.84);
  }

  /** 사진 목록 → 세로 아카이브 영상 (720×1280) */
  function pickMime() {
    if (typeof MediaRecorder === "undefined") return null;
    const list = ["video/mp4;codecs=avc1.42E01E", "video/mp4", "video/webm;codecs=vp9", "video/webm;codecs=vp8", "video/webm"];
    for (const m of list) { try { if (MediaRecorder.isTypeSupported(m)) return m; } catch (e) {} }
    return "";
  }
  function grid(g, W, H, color, alpha) {
    g.fillStyle = color; g.fillRect(0, 0, W, H);
    g.strokeStyle = `rgba(255,255,255,${alpha})`; g.lineWidth = 2;
    for (let x = 0; x <= W; x += 48) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, H); g.stroke(); }
    for (let y = 0; y <= H; y += 48) { g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); }
  }
  const ease = (u) => 1 - Math.pow(1 - Math.min(1, Math.max(0, u)), 3);

  function drawVideoFrame(g, W, H, t, plan) {
    const { intro, per, outro, items, title, stats } = plan;
    if (t < intro) {
      grid(g, W, H, "#2FA463", 0.16);
      const u = ease(t / 0.9);
      g.globalAlpha = u; g.textAlign = "center";
      g.fillStyle = "#FFEB3B"; g.font = `92px ${FONT_DISPLAY}`; g.fillText("기후행동", W / 2, 470 - (1 - u) * 40);
      g.fillText("실천모임", W / 2, 575 - (1 - u) * 40);
      g.fillStyle = "#fff"; g.font = `78px ${FONT_DISPLAY}`; g.fillText("에코쌤즈", W / 2, 675 - (1 - u) * 40);
      g.fillStyle = "#FFFBE6"; g.fillRect(W / 2 - 250, 730, 500, 72);
      g.strokeStyle = "#1E7F4A"; g.lineWidth = 4; g.strokeRect(W / 2 - 250, 730, 500, 72);
      g.fillStyle = "#1E7F4A"; g.font = `40px ${FONT_DISPLAY}`; g.fillText(title, W / 2, 780);
      g.fillStyle = "#fff"; g.font = `28px ${FONT_BODY}`; g.fillText(plan.range, W / 2, 870);
      g.globalAlpha = 1;
      return;
    }
    const tp = t - intro, idx = Math.floor(tp / per);
    if (idx < items.length) {
      const it = items[idx], u = (tp - idx * per) / per, M = MODE_INFO[it.mode] || MODE_INFO.team;
      grid(g, W, H, it.mode === "solo" ? "#2386BC" : it.mode === "activity" ? "#D9781E" : it.mode === "meeting" ? "#8A5E2A" : "#2FA463", 0.13);
      // 위: 따로/같이 꼬리표 + 순번
      g.textAlign = "left"; g.fillStyle = "#fff"; g.font = `44px ${FONT_DISPLAY}`;
      g.fillText(`${M.label} · ${it.researcher}`, 56, 120);
      g.textAlign = "right"; g.font = `30px ${FONT_STAMP}`; g.fillText(`${String(idx + 1).padStart(2, "0")} / ${String(items.length).padStart(2, "0")}`, W - 56, 118);
      // 사진 프레임 카드 (살짝 들어오며 확대)
      const a = Math.min(1, u / 0.14, (1 - u) / 0.1);
      const fw = 600, fh = 750, s = 0.97 + 0.05 * u, rot = (idx % 2 ? 1 : -1) * (0.035 - 0.02 * u);
      g.save(); g.globalAlpha = Math.max(0, a); g.translate(W / 2, 640); g.rotate(rot); g.scale(s, s);
      g.shadowColor = "rgba(0,0,0,.35)"; g.shadowBlur = 30; g.shadowOffsetY = 14;
      if (it.img) g.drawImage(it.img, -fw / 2, -fh / 2, fw, fh); else { g.fillStyle = "#FFFBEF"; g.fillRect(-fw / 2, -fh / 2, fw, fh); }
      g.restore();
      // 아래: 탄소 고정·장소
      g.globalAlpha = Math.max(0, a); g.textAlign = "center"; g.fillStyle = "#fff";
      g.font = `30px ${FONT_BODY}`; g.fillText(it.caption, W / 2, 1100);
      g.globalAlpha = 1;
      // 진행 막대 (필름 칸)
      const n = items.length, gap = 6, bw = Math.min(40, (W - 112 - gap * (n - 1)) / n);
      const total = n * bw + (n - 1) * gap; let x = (W - total) / 2;
      for (let i = 0; i < n; i++) { g.fillStyle = i < idx ? "#FFEB3B" : i === idx ? "#fff" : "rgba(255,255,255,.3)"; g.fillRect(x, 1190, bw, 10); x += bw + gap; }
      return;
    }
    // 마무리
    const to = t - intro - items.length * per, u = ease(to / 0.8);
    grid(g, W, H, "#1E7F4A", 0.12);
    g.globalAlpha = u; g.textAlign = "center";
    g.fillStyle = "#FFEB3B"; g.font = `70px ${FONT_DISPLAY}`; g.fillText("따로 또 같이", W / 2, 360);
    g.fillStyle = "#fff"; g.font = `34px ${FONT_BODY}`; g.fillText("우리가 함께 기록한 초록", W / 2, 420);
    const rows = [["따로 · 우리 동네", stats.solo + "건"], ["같이 · 학교", stats.team + "건"], ["함께한 활동·협의", stats.acts + "장"], ["만난 식물", stats.species + "종"], ["탄소 고정 합계 (g/h·m²)", stats.carbon]];
    rows.forEach(([k, v], i) => {
      const y = 520 + i * 98;
      g.fillStyle = "rgba(255,255,255,.12)"; g.fillRect(90, y - 62, W - 180, 88);
      g.textAlign = "left"; g.fillStyle = "#DFF5E6"; g.font = `30px ${FONT_BODY}`; g.fillText(k, 120, y);
      g.textAlign = "right"; g.fillStyle = "#FFEB3B"; g.font = `44px ${FONT_DISPLAY}`; g.fillText(v, W - 120, y + 2);
    });
    g.textAlign = "center"; g.fillStyle = "#fff"; g.font = `30px ${FONT_DISPLAY}`; g.fillText("이정연 · 신민화 · 이귀리 · 정종화", W / 2, 1060);
    g.font = `24px ${FONT_BODY}`; g.fillStyle = "#CDEBD7"; g.fillText(TEAM + " · 우리 지역 광합성 지도", W / 2, 1106);
    g.globalAlpha = 1;
  }

  function buildPlan(recs, opts) {
    const per = opts.per || 2.2;
    const items = recs.map((r) => (r.kind === "activity" || r.kind === "meeting")
      ? { mode: r.kind, researcher: (r.people && r.people.length ? r.people.join("·") : r.researcher), img: r._img || null, caption: r.title || (r.kind === "meeting" ? "에코쌤즈 협의회" : "우리의 활동") }
      : { mode: r.mode, researcher: r.researcher, img: r._img || null,
          caption: `${r.koreanName || "이름 모를 식물"} · 탄소 ${r.model && isFinite(r.model.gco2) ? r.model.gco2.toFixed(2) : "–"} g/h·m²` });
    const plants = recs.filter((r) => r.kind !== "activity" && r.kind !== "meeting");
    const ts = recs.map((r) => r.ts).sort((a, b) => a - b);
    const d = (x) => { const v = new Date(x); return `${v.getFullYear()}.${v.getMonth() + 1}.${v.getDate()}`; };
    const species = new Set(plants.map((r) => r.scientificName || r.koreanName).filter(Boolean)).size;
    const carbon = plants.reduce((s, r) => s + (r.model && r.model.gco2 || 0), 0).toFixed(1);
    return { intro: 2.6, per, outro: 3.6, items, title: opts.title || "따로 또 같이",
      range: ts.length ? (d(ts[0]) === d(ts[ts.length - 1]) ? d(ts[0]) : `${d(ts[0])} – ${d(ts[ts.length - 1])}`) : "",

  async function makeVideo(recs, opts = {}) {

    const g = canvas.getContext("2d");
    drawVideoFrame(g, 720, 1280, 0, plan);
    const stream = canvas.captureStream(30);

  /** JPEG EXIF 촬영 시각(DateTimeOriginal) 읽기. 없으면 null */
  async function exifDate(file) {

      const buf = await file.slice(0, 256 * 1024).arrayBuffer(); const v = new DataView(buf);

          const scan = (ifd, want) => { const n = u16(t + ifd); for (let i = 0; i < n; i++) { const e = t + ifd + 2 + i * 12; if (u16(e) === want) return e; } return -1; };
          let found = null;

          return null;
        }

        o += 2 + size;
      }
    } catch (e) {}

  }

<script>
/* ===== 한글(.hwpx) 협의록 만들기 =====
 * python-hwpx로 만든 틀(EcoHwpxTpl)의 표·문단을 복사해 내용을 채우고, 사진은 BinData로 넣는다.
 * 협의회 여러 건이면 한 파일에 쪽 나눔으로 이어 붙인다.
 */
(function (root) {
  const HU_PER_MM = 7200 / 25.4;
  const esc = (s) => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;")
    // XML 1.0에 넣을 수 없는 제어 문자 제거
    .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, "");
  const DAYS = ["일", "월", "화", "수", "목", "금", "토"];
  const pad = (n) => String(n).padStart(2, "0");
  function fmtWhen(ts) {
    const d = new Date(ts);
    return `${d.getFullYear()}. ${d.getMonth() + 1}. ${d.getDate()}.(${DAYS[d.getDay()]}) ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  /** 문단 하나(<hp:p ...>…</hp:p>)의 시작·끝 위치 */
  function paraAround(xml, idx) {
    const s = xml.lastIndexOf("<hp:p ", idx);
    const e = xml.indexOf("</hp:p>", idx) + "</hp:p>".length;
    return [s, e];
  }
  /** 자리표시 문단을 여러 줄 문단으로 바꾸기 */
  function fillLines(xml, token, text) {
    const i = xml.indexOf(token); if (i < 0) return xml;
    const [s, e] = paraAround(xml, i);
    const tpl = xml.slice(s, e);
    const lines = String(text ?? "").replace(/\r/g, "").split("\n");
    const out = lines.map((ln) => tpl.replace(token, esc(ln))).join("");
    return xml.slice(0, s) + out + xml.slice(e);
  }
  function removePara(xml, token) {
    const i = xml.indexOf(token); if (i < 0) return xml;
    const [s, e] = paraAround(xml, i);
    return xml.slice(0, s) + xml.slice(e);
  }

  /** 할 일 목록을 글로 */
  function todoText(m) {
    const list = (m.todos || []).filter((t) => t && (t.what || t.task));
    if (!list.length) return "";
    return list.map((t) => `- ${t.what || t.task}${t.who ? ` (담당: ${t.who})` : ""}${t.when ? ` · ${t.when}` : ""}`).join("\n");
  }

  /**
   * @param {Array} meetings 협의회 기록 [{ts, place, people, title, content, decisions, todos, researcher, editedBy}]
   * @param {Object} opt { team, photos: (m) => [{bytes:Uint8Array, w, h, ext}] (이미 읽어 둔 사진) }
   * @returns {Promise<Blob|Uint8Array>}
   */
  async function build(meetings, opt = {}) {
    const T = root.EcoHwpxTpl, JSZip = root.JSZip;
    if (!T || !JSZip) throw new Error("한글 파일 도구를 불러오지 못했어요.");
    const team = opt.team || "기후행동 실천모임 에코쌤즈";
    const sec = T.section;
    const tStart = sec.lastIndexOf("<hp:p ", sec.indexOf("{{TITLE}}"));
    const endTok = sec.indexOf("{{END}}");
    const [, bEnd] = paraAround(sec, endTok);
    const head = sec.slice(0, tStart), block = sec.slice(tStart, bEnd), tail = sec.slice(bEnd);
    // 사진 문단 틀
    const picAt = block.indexOf("<hp:pic ");
    const [pS, pE] = paraAround(block, picAt);
    const picPara = block.slice(pS, pE);
    const runS = picPara.indexOf("<hp:run"), runE = picPara.lastIndexOf("</hp:run>") + "</hp:run>".length;
    const picRun = picPara.slice(runS, runE);
    const picParaOpen = picPara.slice(0, runS), picParaClose = picPara.slice(runE);
    const blockNoPic = block.slice(0, pS) + "{{PICS}}" + block.slice(pE);

    let nextId = 1000000 + Math.floor(Math.random() * 1000000);
    const reId = (x) => x.replace(/\b(id|instid)="(\d+)"/g, (all, k, v) => (v === "0" ? all : `${k}="${nextId++}"`));
    const bins = []; // {id, name, bytes, mime}
    const prv = [];
    const sorted = meetings.slice().sort((a, b) => a.ts - b.ts);
    let body = "";
    for (let mi = 0; mi < sorted.length; mi++) {
      const m = sorted[mi];
      let b = blockNoPic;
      const title = `${team} 협의록${m.title ? ` - ${m.title}` : ""}`;
      b = b.replace("{{TITLE}}", esc(title));
      b = b.replace("{{SUB}}", esc(`${fmtWhen(m.ts)} · ${m.place || "장소 미정"}`));
      const people = (m.people || []).join(", ");
      const vals = [fmtWhen(m.ts), m.place || "", `${people}${people ? ` (${(m.people || []).length}명)` : ""}`, m.title || "",
        m.content || "", m.decisions || "", todoText(m) || m.next || "", m.editedBy || m.researcher || ""];
      vals.forEach((v, i) => { b = fillLines(b, `{{V${i}}}`, v); });
      // 사진
      const photos = opt.photos ? await opt.photos(m) : [];
      if (photos.length) {
        const W = 72 * HU_PER_MM; // 두 장이 본문 폭(150mm)에 나란히
        let paras = "";
        for (let i = 0; i < photos.length; i += 2) {
          let runs = "";
          for (const ph of photos.slice(i, i + 2)) {
            const id = `BIN${String(bins.length + 1).padStart(4, "0")}`;
            const ext = ph.ext || "jpg";
            bins.push({ id, name: `BinData/${id}.${ext}`, bytes: ph.bytes, mime: ext === "png" ? "image/png" : "image/jpeg" });
            const w = Math.round(W), h = Math.round(W * (ph.h / ph.w || 1.25));
            let r = picRun.replace("{{BIN}}", id);
            r = r.replace(/<hp:orgSz width="\d+" height="\d+"\/>/, `<hp:orgSz width="${w}" height="${h}"/>`)
              .replace(/<hp:curSz width="\d+" height="\d+"\/>/, `<hp:curSz width="${w}" height="${h}"/>`)
              .replace(/centerX="\d+" centerY="\d+"/, `centerX="${w >> 1}" centerY="${h >> 1}"`)
              .replace(/<hc:pt1 x="\d+" y="0"\/>/, `<hc:pt1 x="${w}" y="0"/>`)
              .replace(/<hc:pt2 x="\d+" y="\d+"\/>/, `<hc:pt2 x="${w}" y="${h}"/>`)
              .replace(/<hc:pt3 x="0" y="\d+"\/>/, `<hc:pt3 x="0" y="${h}"/>`)
              .replace(/<hp:imgClip left="0" right="\d+" top="0" bottom="\d+"\/>/, `<hp:imgClip left="0" right="${w}" top="0" bottom="${h}"/>`)
              .replace(/<hp:imgDim dimwidth="\d+" dimheight="\d+"\/>/, `<hp:imgDim dimwidth="${w}" dimheight="${h}"/>`)
              .replace(/<hp:sz width="\d+" height="\d+" widthRelTo/, `<hp:sz width="${w}" height="${h}" widthRelTo`)
              .replace(/<hp:outMargin left="0" right="0" top="0" bottom="0"\/><hp:shapeComment/, `<hp:outMargin left="0" right="850" top="0" bottom="283"/><hp:shapeComment`);
            runs += r;
          }
          paras += picParaOpen + runs + picParaClose;
        }
        b = b.replace("{{PICS}}", paras);
      } else {
        b = b.replace("{{PICS}}", "");
        b = removePara(b, "■ 협의회 사진");
      }
      b = removePara(b, "{{END}}");
      if (mi > 0) b = b.replace('pageBreak="0"', 'pageBreak="1"'); // 첫 문단(제목)에서 쪽 나눔
      body += reId(b);
      prv.push(`${title}\n${vals[0]} ${vals[1]}`);
    }
    const section = head + body + tail;

    const zip = new JSZip();
    const NF = { createFolders: false }; // 한글 패키지에는 폴더 항목을 따로 넣지 않는다
    const F = T.files;
    const now = new Date();
    for (const name of T.order) {
      if (name === "Contents/section0.xml") { zip.file(name, section, NF); continue; }
      const f = F[name]; if (!f) continue;
      if (name === "mimetype") { zip.file(name, f.text, { compression: "STORE", createFolders: false }); continue; }
      if (f.b64) { zip.file(name, f.b64, { base64: true, createFolders: false }); continue; }
      let t = f.text;
      if (name === "Contents/content.hpf") {
        const items = bins.map((x) => `<opf:item id="${x.id}" href="${x.name}" media-type="${x.mime}" isEmbeded="1"/>`).join("");
        t = t.replace("</opf:manifest>", items + "</opf:manifest>")
          .replace(/<opf:title\/>|<opf:title>[^<]*<\/opf:title>/, `<opf:title>${esc(team)} 협의록</opf:title>`)
          .replace(/(name="ModifiedDate" content="text">)[^<]*/, `$1${now.toISOString().slice(0, 19)}Z`)
          .replace(/(name="CreatedDate" content="text">)[^<]*/, `$1${now.toISOString().slice(0, 19)}Z`)
          .replace(/(name="date" content="text">)[^<]*/, `$1${now.toLocaleString("ko-KR")}`);
      }
      if (name === "Preview/PrvText.txt") t = prv.join("\n\n").slice(0, 1000);
      zip.file(name, t, NF);
    }
    for (const x of bins) zip.file(x.name, x.bytes, NF);
    return zip.generateAsync({ type: opt.type || "blob", mimeType: "application/hwp+zip", compression: "DEFLATE" });
  }

  /** dataURL → {bytes, w, h, ext} (브라우저) */
  async function photoFromDataURL(url) {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const b64 = url.slice(url.indexOf(",") + 1), bin = atob(b64), bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return { bytes, w: img.naturalWidth, h: img.naturalHeight, ext: /^data:image\/png/.test(url) ? "png" : "jpg" };
  }

  root.EcoHwpx = { build, photoFromDataURL, fmtWhen };
  if (typeof module !== "undefined") module.exports = root.EcoHwpx;
})(typeof window !== "undefined" ? window : globalThis);

</script>

  if (props) {

    for (const k in props) {

    }

  _p: null, mem: new Map(),

      try {

        rq.onupgradeneeded = () => rq.result.createObjectStore("records", { keyPath: "id" });
        rq.onsuccess = () => res(rq.result);

function resizeImage(file, maxDim, q) {
  return new Promise((res, rej) => {
    const rd = new FileReader();
    rd.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let { width: w, height: hh } = img; const s = Math.min(1, maxDim / Math.max(w, hh));
        w = Math.round(w * s); hh = Math.round(hh * s);
        const c = document.createElement("canvas"); c.width = w; c.height = hh; c.getContext("2d").drawImage(img, 0, 0, w, hh);
        res(c.toDataURL("image/jpeg", q));
      };
      img.onerror = rej; img.src = e.target.result;
    };
    rd.onerror = rej; rd.readAsDataURL(file);
  });
}

async function fetchWeather(lat, lng) {
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat.toFixed(4)}&longitude=${lng.toFixed(4)}` +
    `&current=temperature_2m,relative_humidity_2m,cloud_cover,shortwave_radiation,is_day&timezone=Asia%2FSeoul`;
  const ctrl = new AbortController(); const t = setTimeout(() => ctrl.abort(), 9000);
  try {
    const r = await fetch(url, { signal: ctrl.signal });
    if (!r.ok) throw new Error("기상 서버 응답 " + r.status);
    const d = await r.json(); const c = d.current;
    if (!c) throw new Error("기상 데이터 형식이 달라요");
    const ppfd = M.ppfdFromSW(c.shortwave_radiation);
    return { temp: c.temperature_2m, rh: c.relative_humidity_2m, cloud: c.cloud_cover, sw: c.shortwave_radiation,
      isDay: c.is_day, ppfd: Math.round(ppfd), par: M.parIndex(ppfd), lat, lng, fetchedAt: Date.now() };
  } finally { clearTimeout(t); }
}

/* ---------- 지도 바탕: 위성사진(기본) · 지명 · 일반 지도 ---------- */
const ESRI_SAT = "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}";
const CARTO_LABELS = "https://{s}.basemaps.cartocdn.com/rastertiles/voyager_only_labels/{z}/{x}/{y}{r}.png";
const CARTO_ROAD = "https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png";
const OSM_ATTR = '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions" target="_blank">CARTO</a>';
const MAX_Z = 22;
function addBaseLayers(map) {
  const sat = L.tileLayer(ESRI_SAT, { maxNativeZoom: 19, maxZoom: MAX_Z, attribution: "위성사진 &copy; Esri, Maxar, Earthstar Geographics" });
  const labels = L.tileLayer(CARTO_LABELS, { subdomains: "abcd", maxNativeZoom: 20, maxZoom: MAX_Z, attribution: OSM_ATTR, pane: "overlayPane" });
  const road = L.tileLayer(CARTO_ROAD, { subdomains: "abcd", maxNativeZoom: 20, maxZoom: MAX_Z, attribution: OSM_ATTR });
  sat.addTo(map); labels.addTo(map);
  L.control.layers({ "위성사진": sat, "일반 지도": road }, { "지명·도로 이름": labels }, { position: "topleft", collapsed: true }).addTo(map);
  L.control.scale({ metric: true, imperial: false, maxWidth: 110 }).addTo(map);
}
const mPerPx = (lat, z) => 156543.03392 * Math.cos(lat * Math.PI / 180) / Math.pow(2, z);

/** 지도 위에 콕 찍어 위치 정하기 (핀 끌기·지도 누르기) */
function LocPicker({ pos, onPick, color }) {
  const elRef = useRef(null), mapRef = useRef(null), pinRef = useRef(null), accRef = useRef(null), cbRef = useRef(onPick);
  const [z, setZ] = useState(19);
  cbRef.current = onPick;
  const start = pos || { lat: DEFAULT_CENTER[0], lng: DEFAULT_CENTER[1] };
  useEffect(() => {
    if (!window.L || !elRef.current) return;
    const map = L.map(elRef.current, { zoomControl: true, maxZoom: MAX_Z, tap: true }).setView([start.lat, start.lng], pos ? 19 : 16);
    addBaseLayers(map);
    const icon = L.divIcon({ className: "", iconSize: [34, 44], iconAnchor: [17, 42], html: `<span class="pick-pin" style="--c:${color || "#DC4B31"}"><i></i></span>` });
    const pin = L.marker([start.lat, start.lng], { draggable: true, icon, autoPan: true }).addTo(map);
    const send = (ll) => cbRef.current({ lat: +ll.lat.toFixed(7), lng: +ll.lng.toFixed(7), accuracy: null, source: "map" });
    pin.on("dragend", () => send(pin.getLatLng()));
    map.on("click", (e) => { pin.setLatLng(e.latlng); send(e.latlng); });
    map.on("zoomend", () => setZ(map.getZoom()));
    mapRef.current = map; pinRef.current = pin; setZ(map.getZoom());
    setTimeout(() => map.invalidateSize(), 150);
    return () => map.remove();
  }, []);
  useEffect(() => {
    const map = mapRef.current, pin = pinRef.current; if (!map || !pin || !pos) return;
    const cur = pin.getLatLng();
    if (Math.abs(cur.lat - pos.lat) > 1e-8 || Math.abs(cur.lng - pos.lng) > 1e-8) { pin.setLatLng([pos.lat, pos.lng]); map.setView([pos.lat, pos.lng], Math.max(map.getZoom(), 19)); }
    if (accRef.current) { accRef.current.remove(); accRef.current = null; }
    if (pos.source === "gps" && pos.accuracy) accRef.current = L.circle([pos.lat, pos.lng], { radius: pos.accuracy, color: "#2B9BD6", weight: 1.5, fillOpacity: 0.12, interactive: false }).addTo(map);
  }, [pos && pos.lat, pos && pos.lng, pos && pos.source]);
  const res = mPerPx(start.lat, z);
  return html`<div class="pickwrap">
    <div ref=${elRef} class="pickmap" role="application" aria-label="위치 고르기 지도. 지도를 누르거나 핀을 끌어 위치를 정해요."></div>
    <div class="pick-read mono">확대 ${z} · 1칸 ≈ ${res < 1 ? (res * 100).toFixed(0) + "cm" : res.toFixed(1) + "m"}</div>
  </div>`;
}

/* ---------- 지도 ---------- */
function MapPanel({ records, homes, selectedId, onSelect, onMapPick, gpsPos, follow, setFollow }) {
  const elRef = useRef(null), mapRef = useRef(null), layerRef = useRef(null), meRef = useRef(null), pickRef = useRef(onMapPick);
  const [ok, setOk] = useState(true);
  pickRef.current = onMapPick;
  const fit = () => {
    const map = mapRef.current; if (!map) return;
    const pts = records.map((r) => [r.lat, r.lng]).concat(homes.map((x) => [x.lat, x.lng]));
    if (pts.length) map.fitBounds(pts, { padding: [40, 40], maxZoom: 17 });
  };
  useEffect(() => {
    if (!window.L || !elRef.current) { setOk(false); return; }
    const map = L.map(elRef.current, { zoomControl: true, maxZoom: MAX_Z }).setView(DEFAULT_CENTER, 13);
    addBaseLayers(map);
    layerRef.current = L.layerGroup().addTo(map);
    map.on("click", (e) => pickRef.current(e.latlng.lat, e.latlng.lng));
    mapRef.current = map; setTimeout(() => { map.invalidateSize(); fit(); }, 200);
    return () => map.remove();
  }, []);
  useEffect(() => {
    const map = mapRef.current, layer = layerRef.current; if (!map || !layer) return;
    layer.clearLayers();
    homes.forEach((x) => {
      L.marker([x.lat, x.lng], { interactive: false, keyboard: false, icon: L.divIcon({ className: "", iconSize: [0, 0], iconAnchor: [0, 0],
        html: `<span class="home-pin" style="--c:${rColor(x.name)}"><i>⌂</i>${x.name} · ${x.label}</span>` }) }).addTo(layer);
    });
    records.forEach((r) => {
      const act = M.activity(r.weather.ppfd), sel = r.id === selectedId;
      const icon = L.divIcon({ className: "", iconSize: [30, 30], iconAnchor: [15, 15],
        html: `<span class="pin pin-${act.key} pin-${r.mode}${sel ? " pin-sel" : ""}${r.sample ? " pin-sample" : ""}" style="--rc:${rColor(r.researcher)}"><i></i><b></b></span>` });
      const m = L.marker([r.lat, r.lng], { icon, title: `${MODES[r.mode].label} · ${r.koreanName || "미동정"} · ${act.label}` });
      m.on("click", (e) => { L.DomEvent.stopPropagation(e); onSelect(r.id); });
      m.addTo(layer);
    });
  }, [records, homes, selectedId, onSelect]);
  useEffect(() => { fit(); }, [records.length, homes.length]);
  useEffect(() => {
    const map = mapRef.current; if (!map || !gpsPos) return;
    const ll = [gpsPos.lat, gpsPos.lng];
    if (!meRef.current) { meRef.current = L.marker(ll, { interactive: false, icon: L.divIcon({ className: "", iconSize: [22, 22], iconAnchor: [11, 11], html: '<span class="me"><i></i></span>' }) }).addTo(map); }
    else meRef.current.setLatLng(ll);
    if (follow) map.panTo(ll, { animate: true });
  }, [gpsPos, follow]);
  const goMe = () => { const map = mapRef.current; if (map && gpsPos) map.setView([gpsPos.lat, gpsPos.lng], 19); setFollow(!follow); };
  return html`<div class="relative">
    <div ref=${elRef} class="mapbox" role="application" aria-label="광합성 지도. 지도를 누르면 그 자리에 새 기록을 만들어요."></div>
    ${!ok && html`<div class="absolute inset-0 grid place-items-center text-mist text-sm p-6 text-center">지도를 불러오지 못했어요. 인터넷 연결을 확인하세요.</div>`}
    <div class="map-tools">
      <button type="button" class=${"tool " + (follow ? "tool-on" : "")} onClick=${goMe} aria-pressed=${follow}><${Icon} name="LocateFixed" size=${16} /><span>${follow ? "따라가는 중" : "내 위치"}</span></button>
      <button type="button" class="tool" onClick=${fit}><${Icon} name="Maximize2" size=${16} /><span>전체 보기</span></button>
    </div>
    <div class="legend">
      ${RESEARCHERS.map((r) => html`<span key=${r.name} class="flex items-center gap-1"><${Dot} color=${r.color} size=${10} />${r.name}</span>`)}
      <span class="text-mist">● 따로 ■ 같이 · 빨리 깜빡일수록 광합성 활발</span>
    </div>
  </div>`;
}

function VideoMaker({ records, onClose }) {
  const withPhoto = records.filter((r) => r.photo);
  const [scope, setScope] = useState("all");
  const [per, setPer] = useState(2.2);
  const [state, setState] = useState("idle"), [prog, setProg] = useState(0), [err, setErr] = useState("");
  const [out, setOut] = useState(null);
  const group = (r) => r.kind === "activity" || r.kind === "meeting";
  const inScope = (r, k) => k === "all" || (k === "activity" ? group(r) : !group(r) && r.mode === k);
  const list = withPhoto.filter((r) => inScope(r, scope)).slice().sort((a, b) => a.ts - b.ts);
  const secs = Math.round(2.6 + list.length * per + 3.6);

  const run = async () => {
    setState("rec"); setErr(""); setProg(0); if (out) { URL.revokeObjectURL(out.url); setOut(null); }
    try {
      const title = scope === "solo" ? "따로 · 우리 동네" : scope === "team" ? "같이 · 학교 식물" : scope === "activity" ? "우리의 활동" : "따로 또 같이";
      const r = await EM.makeVideo(list.map((x) => ({ ...x })), { per, title, onProgress: setProg });
      setOut({ ...r, url: URL.createObjectURL(r.blob), name: `에코쌤즈_${title.replace(/[ ·]+/g, "_")}_${today()}.${r.ext}` }); setState("done");
    } catch (e) { setErr(e.message || String(e)); setState("error"); }
  };
  return html`<div class="modal-bg" onClick=${state === "rec" ? null : onClose}>
    <div class="modal max-w-lg" role="dialog" aria-modal="true" aria-label="아카이브 영상 만들기" onClick=${(e) => e.stopPropagation()}>
      <div class="flex items-center gap-2 mb-3"><${Icon} name="Clapperboard" size=${20} className="text-photon" />
        <h2 class="font-display text-[20px] text-snow">한 번에 영상 만들기</h2>
        ${state !== "rec" && html`<button type="button" class="icon-btn ml-auto" onClick=${onClose} aria-label="닫기"><${Icon} name="X" size=${18} /></button>`}</div>
      ${state !== "done" ? html`<div class="grid gap-3">
        <div class="seg3">${[["all", "모두"], ["solo", "따로"], ["team", "같이"], ["activity", "활동·협의"]].map(([k, l]) => html`<button key=${k} type="button" disabled=${state === "rec"}
          class=${"seg3-b" + (scope === k ? " on" : "") + " s-" + k} onClick=${() => setScope(k)}>${l} ${withPhoto.filter((r) => inScope(r, k)).length}</button>`)}</div>
        <label class="fld"><span>사진 한 장당 ${per.toFixed(1)}초</span>
          <input id="perIn" type="range" min="1.2" max="4" step="0.2" value=${per} disabled=${state === "rec"} onInput=${(e) => setPer(Number(e.target.value))} /></label>
        <p class="text-[13px] text-mist">세로 영상(720×1280)으로 만들어요. 여는 장면 → 사진 ${list.length}장 → 우리 기록 요약 순서이고, 약 ${secs}초 걸려요. 만드는 동안 이 화면을 켜 두세요.</p>

          <span class="text-[12px] text-mist mono">${Math.round(prog * 100)}% · 녹화 중</span></div>`}

    </div>
  </div>`;
}

    ${video && html`<${VideoMaker} records=${all} onClose=${() => setVideo(false)} />`}

}

      <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 mt-3 text-[12px]">
        <div><div class="text-mist">잎 순광합성</div><div class="mono text-snow">${fix(est.aLeaf, 1)} <small class="text-mist">µmol/m²/s</small></div></div>
        <div><div class="text-mist">PPFD</div><div class="mono text-snow">${w.ppfd} <small class="text-mist">· ${act.label}</small></div></div>
        <div><div class="text-mist">엽면적지수 LAI</div><div class="mono text-snow">${fix(est.lai, 1)}</div></div>
        <div><div class="text-mist">온도·건조 보정</div><div class="mono text-snow">×${fix(est.fT, 2)} · ×${fix(est.fVPD, 2)}</div></div>

        군락 = A × (1−e^(−0.5·LAI))/0.5 = ${fix(est.aCanopy, 2)} µmol/m²/s<br/>g CO₂/h·m² = 군락 A × 0.1584</div>

}

/* ---------- 새 기록 ---------- */
function startPos(mode, me, gps, picked) {
  if (picked) return picked;
  if (mode === "solo") { const hm = getHome(me); return { lat: hm.lat, lng: hm.lng, accuracy: null, source: "home" }; }
  return gps ? { lat: gps.lat, lng: gps.lng, accuracy: gps.accuracy, source: "gps" } : null;
}
function RecordModal({ draft, researcher, weather, settings, gps, onClose, onSave, onOpenSettings }) {
  const [mode, setModeS] = useState(draft.mode || "team");
  const [pos, setPos] = useState(() => startPos(draft.mode || "team", researcher, gps, draft.pos));
  const [raw, setRaw] = useState(null);
  const [framed, setFramed] = useState(null);
  const [ai, setAi] = useState(null), [aiState, setAiState] = useState("idle"), [aiErr, setAiErr] = useState("");
  const [saving, setSaving] = useState(false);
  const home = getHome(researcher);
  const [f, setF] = useState({ koreanName: "", scientificName: "", growthForm: "초본", psType: "C3", lai: "", notes: "", place: (draft.mode === "solo") ? home.label : "" });
  const camRef = useRef(null), galRef = useRef(null), tsRef = useRef(Date.now());
  const w = weather || { temp: null, rh: null, cloud: null, sw: 0, ppfd: 0, par: 0 };
  const m = MODES[mode];
  const est = useMemo(() => M.estimate({ sw: w.sw, temp: w.temp, rh: w.rh, psType: f.psType, growthForm: f.growthForm,
    lai: f.lai === "" ? undefined : Number(f.lai) }), [w, f.psType, f.growthForm, f.lai]);
  const meta = { mode, researcher, ts: tsRef.current, name: f.koreanName.trim(), sci: f.scientificName.trim(), place: f.place.trim() || m.place };
  const setMode = (k) => {
    setModeS(k);
    if (!draft.pos) setPos(startPos(k, researcher, gps, null));
    setF((q) => ({ ...q, place: k === "solo" ? (q.place && q.place !== "" && q.place !== MODES.team.place ? q.place : home.label) : (q.place === home.label ? "" : q.place) }));
  };
  useEffect(() => { if (!pos && gps && mode === "team") setPos({ lat: gps.lat, lng: gps.lng, accuracy: gps.accuracy, source: "gps" }); }, [gps]);
  useEffect(() => {
    if (!raw) { setFramed(null); return; }
    let live = true; const t = setTimeout(() => { EM.composeFrame(raw, meta).then((d) => { if (live) setFramed(d); }, () => {}); }, 250);
    return () => { live = false; clearTimeout(t); };
  }, [raw, mode, meta.name, meta.sci, meta.place]);

  const onFile = async (e) => {
    const file = e.target.files && e.target.files[0]; e.target.value = ""; if (!file) return;
    try { tsRef.current = Date.now(); setRaw(await resizeImage(file, 1280, 0.86)); setAi(null); setAiState("idle"); }
    catch (er) { setAiErr("사진을 읽지 못했어요. 다른 사진으로 시도하세요."); setAiState("error"); }
  };
  const p = pos || { lat: DEFAULT_CENTER[0], lng: DEFAULT_CENTER[1], source: "default", accuracy: null };
  const runAI = async () => {
    if (!aiReady(settings)) { onOpenSettings(); return; }
    setAiState("loading"); setAiErr("");
    try {
      const o = await analyzePlant({ settings, dataUrl: raw, weather: w, lat: p.lat, lng: p.lng, mode });
      setAi(o); setAiState("ok");
      setF((q) => ({ ...q, koreanName: o.koreanName || q.koreanName, scientificName: o.scientificName || q.scientificName, growthForm: o.growthForm, psType: o.photosynthesisType,
        lai: o.carbonFixationEst && Number(o.carbonFixationEst.laiEstimate) > 0 ? String(M.clamp(Number(o.carbonFixationEst.laiEstimate), 0.1, 10)) : q.lai }));
    } catch (er) { setAiState("error"); setAiErr(er.message || String(er)); }
  };
  const preview = { id: "draft", ts: tsRef.current, mode, researcher, lat: p.lat, lng: p.lng, ai, weather: w, model: est,
    koreanName: f.koreanName, scientificName: f.scientificName, confidence: ai ? ai.confidence : null, growthForm: f.growthForm, psType: f.psType };
  const canSave = !!(f.koreanName.trim() || raw) && !saving;
  const save = async () => {

    let photo = null;

    onSave({ ...preview, id: uid(), photo, place: meta.place, accuracy: p.accuracy ?? null, source: p.source, lai: est.lai, notes: f.notes.trim(),
      weather: { temp: w.temp, rh: w.rh, cloud: w.cloud, sw: w.sw, ppfd: w.ppfd, par: w.par } });

  const srcLabel = { gps: `내 위치(GPS) ±${Math.round(p.accuracy || 0)}m`, map: "지도에서 콕 찍은 자리", home: `우리 동네 기본 위치 · ${home.label}`, default: "지도를 눌러 위치를 찍어 주세요" }[p.source];

  return html`<div class="modal-bg" onClick=${onClose}>
    <div class="modal" role="dialog" aria-modal="true" aria-label="새 식물 기록" onClick=${(e) => e.stopPropagation()} style=${{ borderColor: m.color }}>

          ${["solo", "team"].map((k) => html`<button key=${k} type="button" class=${"seg3-b" + (mode === k ? " on" : "") + " s-" + k} onClick=${() => setMode(k)}>
            ${MODES[k].label} · ${k === "solo" ? "우리 동네" : "학교"}</button>`)}
        </div>
        <button type="button" class="icon-btn" onClick=${onClose} aria-label="닫기"><${Icon} name="X" size=${18} /></button>
      </div>
