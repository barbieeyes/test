<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>에코쌤즈 따로 또 같이</title>
<meta name="description" content="에코쌤즈 기후행동 실천모임 · 우리 지역 광합성 지도: 실시간 일사량·PAR 지수, 식물 AI 동정, 탄소 고정 잠재량 지도">
<meta name="theme-color" content="#2FA463">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232FA463'/%3E%3Ccircle cx='32' cy='34' r='17' fill='%234FB7E8'/%3E%3Cpath d='M22 28c5-4 9 1 6 5s3 7-2 9c-5-2-8-8-4-14zM38 24c5 0 8 4 6 8s-6 2-7-2 0-6 1-6z' fill='%2378C04A'/%3E%3Cpath d='M32 17c0-6 4-10 10-11-1 6-4 10-10 11z' fill='%23FFEB3B'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Share+Tech+Mono&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
  tailwind.config = {
    theme: { extend: {
      colors: {
        snow: "#1D3B2A", mist: "#5F7A68", photon: "#1E9E57", chloro: "#2FA463",
        amber: { DEFAULT: "#D98E04" }, line: "rgba(29,59,42,0.12)",
      },
      fontFamily: {
        display: ['"Jua"', '"IBM Plex Sans KR"', "system-ui", "sans-serif"],
        sans: ['"IBM Plex Sans KR"', "system-ui", "-apple-system", '"Apple SD Gothic Neo"', '"Malgun Gothic"', "sans-serif"],
        mono: ['"JetBrains Mono"', "ui-monospace", "SFMono-Regular", "Menlo", "monospace"],
      },
    } },
  };
</script>
<style>
/* 레이아웃: 포스터식 초록 격자 머리 그림(제목·부제 상자·캐릭터·언덕) → 흰 카드 대시보드 한 열. 단일 밝은 테마 */
:root{
  --grass:#2FA463; --grass-deep:#1E7F4A; --grass-ink:#1D3B2A; --lime:#C6DE3A; --leaf:#7CC242;
  --sun:#FFEB3B; --cream:#FFFBE6; --paper:#F6FAF2; --card:#FFFFFF; --mist:#5F7A68;
  --line:rgba(29,59,42,.12); --line-2:rgba(29,59,42,.2); --sky:#4FB7E8; --amber:#D98E04; --rose:#D9365A;
  --f-display:"Jua","IBM Plex Sans KR",system-ui,sans-serif;
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--paper);color:var(--grass-ink);font-family:var(--f-body);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.font-display{font-family:var(--f-display);font-weight:400;letter-spacing:.01em;text-wrap:balance}
.wrap{max-width:1080px;margin:0 auto;padding-top:18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--grass)}

/* ===== 포스터식 머리 그림 ===== */
.hero{position:relative;overflow:hidden;background-color:var(--grass);
  background-image:linear-gradient(rgba(255,255,255,.16) 1.5px,transparent 1.5px),linear-gradient(90deg,rgba(255,255,255,.16) 1.5px,transparent 1.5px);
  background-size:44px 44px;background-position:-1px -1px}
.hero-in{position:relative;z-index:2;max-width:1080px;margin:0 auto;text-align:center;
  padding-block:22px 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hero-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.hero-chip{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;background:rgba(255,255,255,.18);border:1.5px solid rgba(255,255,255,.45);
  color:#fff;font-size:12.5px;font-weight:600;letter-spacing:.02em}
.hero-title{font-family:var(--f-display);font-weight:400;margin:6px 0 0;line-height:1.08;font-size:clamp(38px,9.4vw,92px);letter-spacing:.01em;
  text-wrap:balance;text-shadow:0 4px 0 rgba(20,90,50,.35)}
.hero-title .y{color:var(--sun)} .hero-title .w{color:#fff} .hero-title span{white-space:nowrap}
.hero-sub{display:inline-block;margin-top:16px;background:var(--cream);color:var(--grass-deep);font-family:var(--f-display);
  font-size:clamp(17px,3.6vw,30px);padding:8px clamp(16px,4vw,34px);border:3px solid var(--grass-deep);box-shadow:7px 7px 0 rgba(255,255,255,.55);text-wrap:balance}
.hero-app{margin-top:12px;color:#fff;font-size:13px;font-weight:600;opacity:.95}
.hero-art{position:relative;z-index:1;display:block;width:100%;height:clamp(150px,27vw,330px);margin-top:-18px}
.hero-small .hero-title{font-size:clamp(30px,6.4vw,58px)} .hero-small .hero-sub{font-size:clamp(15px,2.8vw,22px);margin-top:12px}
.hero-small .hero-art{height:clamp(130px,20vw,240px)}

/* 사용자 바 */
.me-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--card);border:2px solid var(--grass);border-radius:16px;padding:9px 12px}
.me-name{font-family:var(--f-display);font-size:18px;color:var(--grass-deep)}
.icon-btn{width:36px;height:36px;display:grid;place-items:center;border-radius:11px;border:1.5px solid var(--line-2);background:#fff;color:var(--mist)}
.icon-btn:hover{color:var(--grass-deep);border-color:var(--grass)}

/* 카드와 섹션 머리표 (포스터의 초록 알약 제목) */
.glass{background:var(--card);border:1.5px solid var(--line);border-radius:20px;box-shadow:0 6px 18px rgba(30,127,74,.07);min-width:0}
.glass-2{background:#FBFDF7;border:1.5px solid var(--line);border-radius:16px}
.pill-h{display:inline-flex;align-items:center;gap:7px;background:var(--grass);color:#fff;font-family:var(--f-display);font-size:18px;
  padding:5px 16px 4px;border-radius:999px;box-shadow:0 3px 0 var(--grass-deep)}
.stat{background:#F3F8EC;border:1.5px solid rgba(124,194,66,.28);border-radius:14px;padding:9px 11px;min-width:0}
.lbl{font-size:11.5px;font-weight:700;letter-spacing:.06em;color:var(--grass-deep);margin-bottom:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;font-size:13px;color:var(--mist);border:1.5px solid var(--line-2);background:#fff}
.chip:hover{color:var(--grass-deep);border-color:var(--grass)}
.chip-on{color:#fff;border-color:var(--grass);background:var(--grass)}
.badge{display:inline-flex;align-items:center;padding:1px 9px;border-radius:999px;font-size:12px;font-family:var(--f-mono);border:1.5px solid var(--line-2);color:var(--mist);background:#fff}
.bar{height:8px;border-radius:99px;background:#E6EFDC;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--leaf),var(--grass));transition:width .6s ease}
.tax{display:inline-flex;gap:5px;padding:2px 9px;border-radius:8px;background:#F3F8EC;border:1px solid rgba(124,194,66,.35);color:var(--grass-ink)}
.tax b{font-weight:700;color:var(--grass)}
.carbon{border-radius:16px;padding:14px;border:2px solid var(--grass);background:linear-gradient(140deg,#EFF8E4,#FFFBE6)}
.glow{text-shadow:none}
.insight{border-radius:14px;padding:12px;background:#FFF8DB;border:1.5px solid #F2D45A}
.link-btn{display:inline-flex;align-items:center;gap:5px;color:var(--grass-deep);font-size:13px;font-weight:600}
.link-btn:hover{color:var(--grass)}

/* 지도 */
.mapbox{height:max(340px,54vh);border-radius:16px;overflow:hidden;border:2px solid var(--grass);background:#E8F1E0}
.leaflet-container{background:#E8F1E0;font-family:var(--f-body)}
.map-tools{position:absolute;top:10px;right:10px;z-index:500;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.tool{display:flex;align-items:center;gap:6px;padding:7px 11px;border-radius:11px;font-size:13px;font-weight:600;background:#fff;border:1.5px solid var(--line-2);color:var(--grass-ink);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.tool-on{color:#fff;background:var(--grass);border-color:var(--grass)}
.fab{position:absolute;bottom:34px;right:10px;z-index:500;display:flex;align-items:center;gap:7px;padding:11px 16px;border-radius:14px;font-family:var(--f-display);font-size:16px;
  color:var(--grass-ink);background:var(--sun);border:2.5px solid var(--grass-deep);box-shadow:4px 4px 0 var(--grass-deep)}
.legend{position:absolute;left:10px;bottom:34px;z-index:500;display:flex;gap:10px;flex-wrap:wrap;max-width:calc(100% - 210px);padding:6px 10px;border-radius:11px;font-size:12px;
  background:rgba(255,255,255,.95);border:1.5px solid var(--line-2);color:var(--grass-ink)}
.lg{width:10px;height:10px;border-radius:50%;display:inline-block}
.lg-high{background:#16A34A} .lg-mid{background:#84CC16} .lg-low{background:#F59E0B}
@media (max-width:560px){.legend{max-width:calc(100% - 20px);bottom:auto;top:10px;right:auto}.map-tools{top:auto;bottom:86px}}

/* 엽록소 펄스 마커 */
.pin{position:relative;display:block;width:28px;height:28px;--c:#84CC16}
.pin-high{--c:#16A34A} .pin-mid{--c:#84CC16} .pin-low{--c:#F59E0B}
.pin::before,.pin::after{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--rc,var(--c));opacity:.5;animation:pulse 2.4s ease-out infinite}
.pin::after{animation-delay:1.2s}
.pin-high::before,.pin-high::after{animation-duration:1.5s}
.pin-low::before,.pin-low::after{animation-duration:3.4s;opacity:.35}
.pin i{position:absolute;inset:7px;border-radius:50%;background:var(--rc,var(--c));box-shadow:0 0 6px rgba(0,0,0,.4)}
.pin b{position:absolute;inset:4px;border-radius:50%;border:2.5px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.5)}
.pin-sample{opacity:.6}
.pin-sel b{inset:1px;border-width:3px}
@keyframes pulse{0%{transform:scale(1);opacity:.5}100%{transform:scale(2.8);opacity:0}}
.me{position:relative;display:block;width:22px;height:22px}
.me::before{content:"";position:absolute;inset:0;border-radius:50%;background:rgba(79,183,232,.3);animation:pulse 2s ease-out infinite}
.me i{position:absolute;inset:5px;border-radius:50%;background:#2B9BD6;border:2.5px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3)}

/* 표 */
.row{background:#F8FBF4;cursor:pointer;transition:background .15s}
.row:hover,.row:focus-visible{background:#EAF5DF}

/* 모달 */
.modal-bg{position:fixed;inset:0;z-index:1000;background:rgba(20,50,32,.5);backdrop-filter:blur(3px);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;
  padding-block:max(24px,env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-bottom,0px));padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.modal{width:100%;max-width:680px;background:#fff;border:3px solid var(--grass);border-radius:22px;padding:18px;box-shadow:0 24px 60px rgba(20,60,35,.35)}
.drop{display:flex;flex-direction:column;align-items:center;gap:6px;padding:22px 10px;border-radius:16px;border:2px dashed var(--leaf);background:#F3F9EA;color:var(--grass-deep);font-size:14px;font-weight:600}
.drop:hover{background:#E8F4DA}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld>span{font-size:11.5px;font-weight:700;letter-spacing:.06em;color:var(--grass-deep)}
.fld input,.fld textarea{width:100%;background:#fff;border:1.5px solid var(--line-2);border-radius:12px;padding:9px 12px;color:var(--grass-ink);font:inherit;font-size:15px}
.fld input:focus,.fld textarea:focus{outline:none;border-color:var(--grass);box-shadow:0 0 0 3px rgba(47,164,99,.18)}
.btn-primary,.btn-save{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px 16px;border-radius:14px;font-size:15px;font-weight:700}
.btn-primary{color:var(--grass-deep);background:#EFF8E4;border:2px solid var(--grass)}
.btn-primary:hover:not(:disabled){background:#E3F2D3}
.btn-save{color:#fff;background:var(--grass);border:2px solid var(--grass-deep);box-shadow:0 4px 0 var(--grass-deep)}
.btn-save:active:not(:disabled){transform:translateY(2px);box-shadow:0 2px 0 var(--grass-deep)}
.btn-ghost{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:12px;border:1.5px solid var(--line-2);font-size:13px;font-weight:600;color:var(--grass-ink);background:#fff}
.btn-danger{padding:8px 12px;border-radius:12px;font-size:13px;font-weight:700;color:#fff;background:var(--rose)}
.err{font-size:13px;color:#9F1239;background:#FFF1F3;border:1.5px solid #FBC8D2;border-radius:12px;padding:9px 12px}
.exp{display:flex;align-items:center;gap:12px;text-align:left;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line-2);background:#fff;color:var(--grass-ink)}
.exp:hover:not(:disabled){border-color:var(--grass);background:#F3F9EA}
.exp b{display:block;font-size:14.5px} .exp small{display:block;color:var(--mist);font-size:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:1200;padding:10px 18px;border-radius:14px;
  background:var(--grass-ink);color:#fff;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:calc(100% - 32px)}
.boot{min-height:60vh;display:grid;place-items:center;color:var(--mist);font-size:14px;text-align:center;padding:24px}

/* 로그인 */
.gate{min-height:100vh;display:flex;flex-direction:column;background:var(--paper)}
.gate-card{width:100%;max-width:440px;margin:-8px auto 0;position:relative;z-index:3;background:#fff;border:3px solid var(--grass-deep);border-radius:24px;padding:20px;
  box-shadow:8px 8px 0 rgba(30,127,74,.25)}
.gate-card.shake{animation:shake .42s}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.who-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.who-b{display:flex;align-items:center;gap:8px;padding:11px 12px;border-radius:14px;border:2px solid var(--line-2);background:#fff;font-size:16px;font-weight:700;color:var(--grass-ink)}
.who-b:hover{border-color:var(--grass)}
.who-on{border-color:var(--grass);background:#EFF8E4;box-shadow:0 3px 0 var(--grass)}
.pin-in{width:100%;text-align:center;font-family:var(--f-mono);font-size:24px;letter-spacing:.6em;padding:11px 12px 11px calc(12px + .6em);border-radius:14px;border:2px solid var(--line-2);color:var(--grass-ink)}
.pin-in:focus{outline:none;border-color:var(--grass);box-shadow:0 0 0 3px rgba(47,164,99,.18)}
.gate-go{width:100%;padding:14px;border-radius:16px;font-family:var(--f-display);font-size:20px;color:var(--grass-ink);background:var(--sun);border:2.5px solid var(--grass-deep);box-shadow:0 4px 0 var(--grass-deep)}
.gate-go:active{transform:translateY(2px);box-shadow:0 2px 0 var(--grass-deep)}

/* ===== 따로 또 같이 ===== */
.hero-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.hero-me{display:inline-flex;align-items:center;gap:7px;padding:5px 12px;border-radius:999px;background:rgba(255,255,255,.2);border:1.5px solid rgba(255,255,255,.5);color:#fff;font-weight:700;font-size:13px}
.hero-motto{display:inline-flex;align-items:baseline;gap:8px;margin-top:14px;color:#fff;font-family:var(--f-display);font-size:clamp(18px,3.4vw,26px);flex-wrap:wrap;justify-content:center}
.hero-motto .m-solo{background:#2B9BD6;padding:2px 12px;border-radius:10px 2px 10px 2px;transform:rotate(-3deg);display:inline-block;box-shadow:3px 3px 0 #1C6E9C}
.hero-motto .m-team{background:var(--sun);color:var(--grass-deep);padding:2px 12px;border-radius:2px 10px 2px 10px;transform:rotate(3deg);display:inline-block;box-shadow:3px 3px 0 var(--grass-deep)}
.hero-motto .m-amp{opacity:.9}
.hero-motto .m-rest{font-family:var(--f-body);font-size:13px;font-weight:600;opacity:.95;flex-basis:100%;text-align:center}
.strip-btn{width:36px;height:36px;display:grid;place-items:center;border-radius:11px;background:rgba(255,255,255,.16);border:1.5px solid rgba(255,255,255,.45);color:#fff}
.strip-btn.on{background:var(--sun);color:var(--grass-deep);border-color:var(--sun)}
.strip{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background-color:var(--grass);
  background-image:linear-gradient(rgba(255,255,255,.14) 1.5px,transparent 1.5px),linear-gradient(90deg,rgba(255,255,255,.14) 1.5px,transparent 1.5px);background-size:32px 32px;
  border-bottom:4px solid var(--lime);box-shadow:0 4px 0 var(--leaf)}
.strip-in{max-width:1080px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.strip-team{color:#E9F7D8;font-size:12px;font-weight:600} .strip-team b{color:var(--sun);font-family:var(--f-display);font-weight:400;font-size:14px}
.strip-title{display:flex;align-items:center;gap:7px;color:#fff;font-family:var(--f-display);font-size:24px;line-height:1.1;white-space:nowrap}
.strip-title small{font-family:var(--f-body);font-size:12px;font-weight:600;color:#E9F7D8;overflow:hidden;text-overflow:ellipsis}
.strip-me{display:inline-flex;align-items:center;gap:6px;color:#fff;font-weight:700;font-size:13px;padding:0 4px}
@media (max-width:420px){.strip-me{display:none}.strip-title small{display:none}}
.tab-is-today .wrap{padding-top:14px}

/* 아래 탭 */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:900;display:grid;grid-template-columns:repeat(6,1fr);background:#fff;border-top:3px solid var(--grass);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);box-shadow:0 -6px 20px rgba(30,127,74,.12)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 9px;font-size:12px;font-weight:700;color:var(--mist);position:relative}
.tab-ic{position:relative;display:grid;place-items:center;width:44px;height:30px;border-radius:999px;transition:background .2s}
.tab-ic i{position:absolute;top:-4px;right:-2px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--sun);color:var(--grass-ink);font-style:normal;font-size:10.5px;line-height:18px;font-family:var(--f-mono);border:1.5px solid var(--grass-deep)}
.tab-on{color:var(--grass-deep)} .tab-on .tab-ic{background:#E3F3D6}
.tab-solo.tab-on{color:#1C6E9C} .tab-solo.tab-on .tab-ic{background:#DDF0FA}
.tab-archive.tab-on .tab-ic{background:#FFF3B0}
.tab-activity.tab-on{color:#B4600E} .tab-activity.tab-on .tab-ic{background:#FDE8D4}
@media (max-width:380px){.tab{font-size:11px}.tab-ic{width:38px}}
/* 활동 사진 */
.act-hero{display:flex;align-items:center;gap:14px;text-align:left;padding:16px;border-radius:20px;background:#E8862A;color:#fff;border:2.5px solid #B4600E;box-shadow:5px 5px 0 #B4600E}
.act-hero:active{transform:translate(2px,2px)}
.act-hero-ic{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;background:rgba(255,255,255,.2);flex:none}
.act-hero b{display:block;font-family:var(--f-display);font-weight:400;font-size:22px} .act-hero small{display:block;font-size:12.5px;opacity:.95;line-height:1.45}
.pill-act{background:#E8862A;box-shadow:0 3px 0 #B4600E}

<body>
<div id="root"><div class="boot">기후행동 실천모임을 여는 중…</div></div>
<noscript><div class="boot">이 앱은 자바스크립트가 필요해요.</div></noscript>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/htm@3.1.1/dist/htm.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
<script>
/* ===== 광합성 추정 모델 (투명하게 공개하는 계산식) =====
 * 1) 광합성유효광량자속밀도 PPFD(µmol/m²/s) ≈ 전천일사량 SW(W/m²) × 0.45(PAR 비율) × 4.57(µmol/J)
 * 2) 잎 단위 순광합성 A = [α·I·Amax / (α·I + Amax)] × f(T) × f(VPD) − Rd   (직각쌍곡선 광반응곡선)
 * 3) 군락 단위: 유효 엽면적 = (1 − e^(−k·LAI)) / k  (Beer 법칙, k = 0.5)
 * 4) g CO₂/h·m² = A(µmol/m²/s) × 3600 × 44.01×10⁻⁶
 * 계수는 교과·문헌의 대표값이며, 현장 측정값이 아닌 '추정치'입니다.
 */
(function (root) {
  const PS_TYPES = {
    C3:  { label: "C₃",  amax: 22, alpha: 0.05,  topt: 25, rdFrac: 0.06, vpdSensitive: true,
           note: "대부분의 식물. 강광·고온에서 광호흡으로 효율이 떨어져요." },
    C4:  { label: "C₄",  amax: 38, alpha: 0.065, topt: 33, rdFrac: 0.05, vpdSensitive: true,
           note: "옥수수·강아지풀 등. 강광·고온에서 효율이 높아요." },
    CAM: { label: "CAM", amax: 3,  alpha: 0.03,  topt: 30, rdFrac: 0.10, vpdSensitive: false,
           note: "다육식물 등. 낮에는 기공을 닫고 밤에 CO₂를 고정해요(낮 값은 매우 작음)." },
  };
  const FORMS = {
    "목본":     { amaxScale: 1.0,  lai: 4.0 },
    "초본":     { amaxScale: 1.0,  lai: 2.5 },
    "양치식물": { amaxScale: 0.45, lai: 1.5 },
    "이끼류":   { amaxScale: 0.2,  lai: 1.0 },
  };
  const K_EXT = 0.5;
  const G_PER_UMOL_HOUR = 3600 * 44.01e-6; // = 0.158436

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const num = (v, d) => (typeof v === "number" && isFinite(v) ? v : d);

  function ppfdFromSW(sw) { return Math.max(0, num(sw, 0)) * 0.45 * 4.57; }
  function parIndex(ppfd) { return Math.round(clamp(num(ppfd, 0) / 2000 * 100, 0, 100)); }
  function activity(ppfd) {
    const p = num(ppfd, 0);
    if (p >= 800) return { key: "high", label: "활발" };
    if (p >= 200) return { key: "mid", label: "보통" };
    return { key: "low", label: "음지" };
  }
  function vpdKPa(tempC, rh) {
    const es = 0.6108 * Math.exp((17.27 * tempC) / (tempC + 237.3));
    return Math.max(0, es * (1 - clamp(num(rh, 60), 0, 100) / 100));
  }

  /** 기상값 + 식물 정보 → 추정 광합성 속도·탄소 고정 잠재량 */
  function estimate({ sw, temp, rh, psType = "C3", growthForm = "초본", lai }) {
    const P = PS_TYPES[psType] || PS_TYPES.C3;
    const F = FORMS[growthForm] || FORMS["초본"];
    const T = num(temp, 20);
    const I = ppfdFromSW(sw);
    const amax = P.amax * F.amaxScale;
    const fT = Math.exp(-Math.pow((T - P.topt) / 12, 2));
    const vpd = vpdKPa(T, rh);
    const fVPD = P.vpdSensitive ? (vpd <= 1 ? 1 : clamp(1 - (vpd - 1) * 0.35, 0.3, 1)) : 1;
    const gross = I > 0 ? (P.alpha * I * amax) / (P.alpha * I + amax) : 0;
    const rd = P.rdFrac * amax * fT;
    const aLeaf = Math.max(0, gross * fT * fVPD - rd); // µmol CO₂/m²(잎)/s
    const L = clamp(num(lai, F.lai), 0.1, 10);
    const effLeaf = (1 - Math.exp(-K_EXT * L)) / K_EXT;
    const aCanopy = aLeaf * effLeaf;                     // µmol CO₂/m²(지면)/s
    const gco2 = aCanopy * G_PER_UMOL_HOUR;             // g CO₂/h·m²(지면)
    return {
      ppfd: Math.round(I), aLeaf: +aLeaf.toFixed(2), aCanopy: +aCanopy.toFixed(2),
      gco2: +gco2.toFixed(2), lai: +L.toFixed(1), effLeaf: +effLeaf.toFixed(2),
      fT: +fT.toFixed(2), fVPD: +fVPD.toFixed(2), vpd: +vpd.toFixed(2), amax: +amax.toFixed(1),
    };
  }

  root.PSModel = { PS_TYPES, FORMS, ppfdFromSW, parIndex, activity, vpdKPa, estimate, clamp };
  if (typeof module !== "undefined") module.exports = root.PSModel;
})(typeof window !== "undefined" ? window : globalThis);

</script>
<script>
/* ===== 사진 프레임 & 아카이브 영상 (캔버스) ===== */
(function (root) {
  const TEAM = "기후행동 실천모임 에코쌤즈";
  const MODE_INFO = {
    solo: { label: "따로", place: "우리 동네", color: "#2B9BD6", deep: "#1C6E9C" },
    team: { label: "같이", place: "학교", color: "#1E9E57", deep: "#16713E" },
    activity: { label: "활동", place: "", color: "#E8862A", deep: "#B4600E" },
  };
  const FONT_DISPLAY = '"Jua", "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif';
  const FONT_BODY = '"IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif';
  const FONT_STAMP = '"Share Tech Mono", "JetBrains Mono", ui-monospace, monospace';

  function loadImg(src) {
    return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
  }
  async function fontsReady() {
    try {
      if (!document.fonts) return;
      await Promise.race([
        Promise.all([document.fonts.load('48px "Jua"'), document.fonts.load('40px "Share Tech Mono"'), document.fonts.load('24px "IBM Plex Sans KR"')]),
        new Promise((r) => setTimeout(r, 1500)),
      ]);
    } catch (e) {}
  }
  function cover(ctx, img, x, y, w, h) {
    const s = Math.max(w / img.width, h / img.height);
    const sw = w / s, sh = h / s, sx = (img.width - sw) / 2, sy = (img.height - sh) / 2;
    ctx.drawImage(img, sx, sy, sw, sh, x, y, w, h);
  }
  function fitText(ctx, text, maxW, font, startPx, minPx) {

const db = {
  _p: null, mem: new Map(),
  open() {
    if (this._p) return this._p;
    this._p = new Promise((res) => {
      try {
        const rq = indexedDB.open("ecossam", 1);
        rq.onupgradeneeded = () => rq.result.createObjectStore("records", { keyPath: "id" });
        rq.onsuccess = () => res(rq.result);
        rq.onerror = () => res(null);
      } catch (e) { res(null); }
    });
    return this._p;
  },
  async all() {
    const d = await this.open(); if (!d) return [...this.mem.values()];
    return new Promise((res) => { const rq = d.transaction("records").objectStore("records").getAll(); rq.onsuccess = () => res(rq.result || []); rq.onerror = () => res([]); });
  },
  async put(r) {
    const d = await this.open(); if (!d) { this.mem.set(r.id, r); return true; }
    return new Promise((res) => { const t = d.transaction("records", "readwrite"); t.objectStore("records").put(r); t.oncomplete = () => res(true); t.onerror = () => res(false); t.onabort = () => res(false); });
  },
  async del(id) {
    const d = await this.open(); if (!d) { this.mem.delete(id); return; }
    return new Promise((res) => { const t = d.transaction("records", "readwrite"); t.objectStore("records").delete(id); t.oncomplete = () => res(); t.onerror = () => res(); });
  },
};

function resizeImage(file, maxDim, q) {
  return new Promise((res, rej) => {
    const rd = new FileReader();
    rd.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let { width: w, height: hh } = img; const s = Math.min(1, maxDim / Math.max(w, hh));
        w = Math.round(w * s); hh = Math.round(hh * s);
        const c = document.createElement("canvas"); c.width = w; c.height = hh; c.getContext("2d").drawImage(img, 0, 0, w, hh);
        res(c.toDataURL("image/jpeg", q));
      };
      img.onerror = rej; img.src = e.target.result;
    };
    rd.onerror = rej; rd.readAsDataURL(file);
  });
}

async function fetchWeather(lat, lng) {

    `&current=temperature_2m,relative_humidity_2m,cloud_cover,shortwave_radiation,is_day&timezone=Asia%2FSeoul`;
  const ctrl = new AbortController(); const t = setTimeout(() => ctrl.abort(), 9000);
  try {
    const r = await fetch(url, { signal: ctrl.signal });
    if (!r.ok) throw new Error("기상 서버 응답 " + r.status);
    const d = await r.json(); const c = d.current;
    if (!c) throw new Error("기상 데이터 형식이 달라요");
    const ppfd = M.ppfdFromSW(c.shortwave_radiation);

      isDay: c.is_day, ppfd: Math.round(ppfd), par: M.parIndex(ppfd), lat, lng, fetchedAt: Date.now() };
  } finally { clearTimeout(t); }
}

function parseAI(text) {
  const t = (text || "").replace(/```json/gi, "").replace(/```/g, "").trim();
  const s = t.indexOf("{"), e = t.lastIndexOf("}");
  const o = JSON.parse(s >= 0 && e > s ? t.slice(s, e + 1) : t);
  if (!PS_LIST.includes(o.photosynthesisType)) o.photosynthesisType = "C3";
  if (!FORM_LIST.includes(o.growthForm)) o.growthForm = "초본";
  o.confidence = M.clamp(Math.round(Number(o.confidence) || 0), 0, 100);
  return o;
}
async function analyzePlant({ apiKey, model, dataUrl, weather, lat, lng, mode }) {
  const b64 = dataUrl.split(",")[1];

    method: "POST",
    headers: { "content-type": "application/json", "x-api-key": apiKey, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" },
    body: JSON.stringify({ model: model || DEFAULT_MODEL, max_tokens: 1400, system: "응답은 반드시 유효한 JSON 객체 하나여야 합니다.",
      messages: [{ role: "user", content: [

        { type: "text", text: buildPrompt(weather, lat, lng, mode) } ] }] }),
  });
  if (!r.ok) {
    let msg = ""; try { const j = await r.json(); msg = (j.error && j.error.message) || ""; } catch (e) {}
    if (r.status === 401) throw new Error("API 키가 올바르지 않아요. 설정에서 키를 다시 확인하세요.");
    if (r.status === 404) throw new Error(`모델 '${model}'을 찾을 수 없어요. 설정에서 모델 이름을 바꿔 보세요.`);
    if (r.status === 429) throw new Error("요청이 많아 잠시 막혔어요. 1분 뒤 다시 시도하세요.");
    throw new Error(`분석 요청 실패 (${r.status}) ${msg}`.trim());
  }
  const d = await r.json();
  const text = (d.content || []).filter((c) => c.type === "text").map((c) => c.text).join("\n");

}

/* ---------- 지도 바탕: 위성사진(기본) · 지명 · 일반 지도 ---------- */
const ESRI_SAT = "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}";
const CARTO_LABELS = "https://{s}.basemaps.cartocdn.com/rastertiles/voyager_only_labels/{z}/{x}/{y}{r}.png";
const CARTO_ROAD = "https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png";
const OSM_ATTR = '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions" target="_blank">CARTO</a>';
const MAX_Z = 22;
function addBaseLayers(map) {
  const sat = L.tileLayer(ESRI_SAT, { maxNativeZoom: 19, maxZoom: MAX_Z, attribution: "위성사진 &copy; Esri, Maxar, Earthstar Geographics" });
  const labels = L.tileLayer(CARTO_LABELS, { subdomains: "abcd", maxNativeZoom: 20, maxZoom: MAX_Z, attribution: OSM_ATTR, pane: "overlayPane" });
  const road = L.tileLayer(CARTO_ROAD, { subdomains: "abcd", maxNativeZoom: 20, maxZoom: MAX_Z, attribution: OSM_ATTR });
  sat.addTo(map); labels.addTo(map);
  L.control.layers({ "위성사진": sat, "일반 지도": road }, { "지명·도로 이름": labels }, { position: "topleft", collapsed: true }).addTo(map);
  L.control.scale({ metric: true, imperial: false, maxWidth: 110 }).addTo(map);
}
const mPerPx = (lat, z) => 156543.03392 * Math.cos(lat * Math.PI / 180) / Math.pow(2, z);

/** 지도 위에 콕 찍어 위치 정하기 (핀 끌기·지도 누르기) */
function LocPicker({ pos, onPick, color }) {
  const elRef = useRef(null), mapRef = useRef(null), pinRef = useRef(null), accRef = useRef(null), cbRef = useRef(onPick);
  const [z, setZ] = useState(19);
  cbRef.current = onPick;
  const start = pos || { lat: DEFAULT_CENTER[0], lng: DEFAULT_CENTER[1] };
  useEffect(() => {
    if (!window.L || !elRef.current) return;
    const map = L.map(elRef.current, { zoomControl: true, maxZoom: MAX_Z, tap: true }).setView([start.lat, start.lng], pos ? 19 : 16);
    addBaseLayers(map);
    const icon = L.divIcon({ className: "", iconSize: [34, 44], iconAnchor: [17, 42], html: `<span class="pick-pin" style="--c:${color || "#DC4B31"}"><i></i></span>` });
    const pin = L.marker([start.lat, start.lng], { draggable: true, icon, autoPan: true }).addTo(map);
    const send = (ll) => cbRef.current({ lat: +ll.lat.toFixed(7), lng: +ll.lng.toFixed(7), accuracy: null, source: "map" });
    pin.on("dragend", () => send(pin.getLatLng()));
    map.on("click", (e) => { pin.setLatLng(e.latlng); send(e.latlng); });
    map.on("zoomend", () => setZ(map.getZoom()));
    mapRef.current = map; pinRef.current = pin; setZ(map.getZoom());
    setTimeout(() => map.invalidateSize(), 150);
    return () => map.remove();
  }, []);
  useEffect(() => {
    const map = mapRef.current, pin = pinRef.current; if (!map || !pin || !pos) return;
    const cur = pin.getLatLng();
    if (Math.abs(cur.lat - pos.lat) > 1e-8 || Math.abs(cur.lng - pos.lng) > 1e-8) { pin.setLatLng([pos.lat, pos.lng]); map.setView([pos.lat, pos.lng], Math.max(map.getZoom(), 19)); }
    if (accRef.current) { accRef.current.remove(); accRef.current = null; }
    if (pos.source === "gps" && pos.accuracy) accRef.current = L.circle([pos.lat, pos.lng], { radius: pos.accuracy, color: "#2B9BD6", weight: 1.5, fillOpacity: 0.12, interactive: false }).addTo(map);
  }, [pos && pos.lat, pos && pos.lng, pos && pos.source]);
  const res = mPerPx(start.lat, z);
  return html`<div class="pickwrap">
    <div ref=${elRef} class="pickmap" role="application" aria-label="위치 고르기 지도. 지도를 누르거나 핀을 끌어 위치를 정해요."></div>
    <div class="pick-read mono">확대 ${z} · 1칸 ≈ ${res < 1 ? (res * 100).toFixed(0) + "cm" : res.toFixed(1) + "m"}</div>
  </div>`;
}

/* ---------- 지도 ---------- */
function MapPanel({ records, homes, selectedId, onSelect, onMapPick, gpsPos, follow, setFollow }) {
  const elRef = useRef(null), mapRef = useRef(null), layerRef = useRef(null), meRef = useRef(null), pickRef = useRef(onMapPick);
  const [ok, setOk] = useState(true);
  pickRef.current = onMapPick;
  const fit = () => {
    const map = mapRef.current; if (!map) return;
    const pts = records.map((r) => [r.lat, r.lng]).concat(homes.map((x) => [x.lat, x.lng]));
    if (pts.length) map.fitBounds(pts, { padding: [40, 40], maxZoom: 17 });
  };
  useEffect(() => {
    if (!window.L || !elRef.current) { setOk(false); return; }
    const map = L.map(elRef.current, { zoomControl: true, maxZoom: MAX_Z }).setView(DEFAULT_CENTER, 13);
    addBaseLayers(map);
    layerRef.current = L.layerGroup().addTo(map);
    map.on("click", (e) => pickRef.current(e.latlng.lat, e.latlng.lng));
    mapRef.current = map; setTimeout(() => { map.invalidateSize(); fit(); }, 200);
    return () => map.remove();
  }, []);
  useEffect(() => {
    const map = mapRef.current, layer = layerRef.current; if (!map || !layer) return;
    layer.clearLayers();
    homes.forEach((x) => {
      L.marker([x.lat, x.lng], { interactive: false, keyboard: false, icon: L.divIcon({ className: "", iconSize: [0, 0], iconAnchor: [0, 0],
        html: `<span class="home-pin" style="--c:${rColor(x.name)}"><i>⌂</i>${x.name} · ${x.label}</span>` }) }).addTo(layer);
    });
    records.forEach((r) => {
      const act = M.activity(r.weather.ppfd), sel = r.id === selectedId;
      const icon = L.divIcon({ className: "", iconSize: [30, 30], iconAnchor: [15, 15],
        html: `<span class="pin pin-${act.key} pin-${r.mode}${sel ? " pin-sel" : ""}${r.sample ? " pin-sample" : ""}" style="--rc:${rColor(r.researcher)}"><i></i><b></b></span>` });
      const m = L.marker([r.lat, r.lng], { icon, title: `${MODES[r.mode].label} · ${r.koreanName || "미동정"} · ${act.label}` });
      m.on("click", (e) => { L.DomEvent.stopPropagation(e); onSelect(r.id); });
      m.addTo(layer);
    });
  }, [records, homes, selectedId, onSelect]);
  useEffect(() => { fit(); }, [records.length, homes.length]);
  useEffect(() => {
    const map = mapRef.current; if (!map || !gpsPos) return;
    const ll = [gpsPos.lat, gpsPos.lng];
    if (!meRef.current) { meRef.current = L.marker(ll, { interactive: false, icon: L.divIcon({ className: "", iconSize: [22, 22], iconAnchor: [11, 11], html: '<span class="me"><i></i></span>' }) }).addTo(map); }
    else meRef.current.setLatLng(ll);
    if (follow) map.panTo(ll, { animate: true });
  }, [gpsPos, follow]);
  const goMe = () => { const map = mapRef.current; if (map && gpsPos) map.setView([gpsPos.lat, gpsPos.lng], 19); setFollow(!follow); };
  return html`<div class="relative">
    <div ref=${elRef} class="mapbox" role="application" aria-label="광합성 지도. 지도를 누르면 그 자리에 새 기록을 만들어요."></div>
    ${!ok && html`<div class="absolute inset-0 grid place-items-center text-mist text-sm p-6 text-center">지도를 불러오지 못했어요. 인터넷 연결을 확인하세요.</div>`}
    <div class="map-tools">
      <button type="button" class=${"tool " + (follow ? "tool-on" : "")} onClick=${goMe} aria-pressed=${follow}><${Icon} name="LocateFixed" size=${16} /><span>${follow ? "따라가는 중" : "내 위치"}</span></button>
      <button type="button" class="tool" onClick=${fit}><${Icon} name="Maximize2" size=${16} /><span>전체 보기</span></button>
    </div>
    <div class="legend">
      ${RESEARCHERS.map((r) => html`<span key=${r.name} class="flex items-center gap-1"><${Dot} color=${r.color} size=${10} />${r.name}</span>`)}
      <span class="text-mist">● 따로 ■ 같이 · 빨리 깜빡일수록 광합성 활발</span>
    </div>
  </div>`;
}

      </div>

        <${Chip} on=${fWho === "all"} onClick=${() => setFWho("all")}>전체</${Chip}>
        ${RESEARCHERS.map((r) => html`<${Chip} key=${r.name} on=${fWho === r.name} color=${r.color} onClick=${() => setFWho(r.name)}><${Dot} color=${fWho === r.name ? "#fff" : r.color} size=${6} />${r.name}</${Chip}>`)}</div>
      <div class="flex flex-wrap gap-1.5 items-center"><span class="lbl mr-1 mb-0">군락</span>
        <${Chip} on=${fForm === "all"} onClick=${() => setFForm("all")}>전체</${Chip}>
        ${FORM_LIST.map((g) => html`<${Chip} key=${g} on=${fForm === g} onClick=${() => setFForm(g)}>${g}</${Chip}>`)}</div>
    </div>

    <p class="text-[12px] text-mist -mt-1">⌂는 각자의 우리 동네, 동그라미는 따로·네모는 같이 기록이에요. 왼쪽 위 겹 버튼으로 위성사진·일반 지도를 바꿀 수 있고, 지도를 누르면 그 자리에 새 기록을 만들어요.</p>
    <section class="glass p-3 grid gap-2">
      <div class="flex items-center gap-2 flex-wrap">
        <span class="font-display text-[17px] text-snow">${filtered.length}곳 · 탄소 고정 합계 <span class="mono text-photon">${fix(sumG, 1)}</span> <small class="text-mist text-[12px]">g/h·m²</small></span>
        <button type="button" class="link-btn ml-auto" onClick=${() => setSort(sort === "carbon" ? "recent" : "carbon")}>
          <${Icon} name="ArrowDownWideNarrow" size=${14} />${sort === "carbon" ? "탄소 고정 높은 순" : "최신 순"}</button>
      </div>
      <div class="rank">
        ${filtered.slice(0, 40).map((r, i) => { const act = M.activity(r.weather.ppfd); return html`<button key=${r.id} type="button" class="rank-row" onClick=${() => onOpen(r.id)}>
          <span class="mono rank-i">${i + 1}</span>
          ${r.photo ? html`<img src=${r.photo} alt="" />` : html`<span class="rank-ph"><${Icon} name="Leaf" size=${16} /></span>`}
          <span class="min-w-0 flex-1 text-left"><b>${r.koreanName || "미동정"}</b><small><${ModeTag} mode=${r.mode} small=${true} /> ${r.researcher} · ${r.place || MODES[r.mode].place}</small></span>
          <span class="text-right"><b class="mono">${fix(r.model.gco2, 2)}</b><small style=${{ color: ACT_COLOR[act.key] }}>PAR ${r.weather.par}</small></span>

function VideoMaker({ records, onClose }) {
  const withPhoto = records.filter((r) => r.photo);
  const [scope, setScope] = useState("all");
  const [per, setPer] = useState(2.2);
  const [state, setState] = useState("idle"), [prog, setProg] = useState(0), [err, setErr] = useState("");
  const [out, setOut] = useState(null);
  const inScope = (r, k) => k === "all" || (k === "activity" ? r.kind === "activity" : r.kind !== "activity" && r.mode === k);
  const list = withPhoto.filter((r) => inScope(r, scope)).slice().sort((a, b) => a.ts - b.ts);
  const secs = Math.round(2.6 + list.length * per + 3.6);
  useEffect(() => () => { if (out) URL.revokeObjectURL(out.url); }, [out]);
  const run = async () => {
    setState("rec"); setErr(""); setProg(0); if (out) { URL.revokeObjectURL(out.url); setOut(null); }
    try {
      const title = scope === "solo" ? "따로 · 우리 동네" : scope === "team" ? "같이 · 학교 식물" : scope === "activity" ? "우리의 활동" : "따로 또 같이";
      const r = await EM.makeVideo(list.map((x) => ({ ...x })), { per, title, onProgress: setProg });
      setOut({ ...r, url: URL.createObjectURL(r.blob), name: `에코쌤즈_${title.replace(/[ ·]+/g, "_")}_${today()}.${r.ext}` }); setState("done");
    } catch (e) { setErr(e.message || String(e)); setState("error"); }
  };
  return html`<div class="modal-bg" onClick=${state === "rec" ? null : onClose}>
    <div class="modal max-w-lg" role="dialog" aria-modal="true" aria-label="아카이브 영상 만들기" onClick=${(e) => e.stopPropagation()}>
      <div class="flex items-center gap-2 mb-3"><${Icon} name="Clapperboard" size=${20} className="text-photon" />
        <h2 class="font-display text-[20px] text-snow">한 번에 영상 만들기</h2>
        ${state !== "rec" && html`<button type="button" class="icon-btn ml-auto" onClick=${onClose} aria-label="닫기"><${Icon} name="X" size=${18} /></button>`}</div>
      ${state !== "done" ? html`<div class="grid gap-3">
        <div class="seg3">${[["all", "모두"], ["solo", "따로"], ["team", "같이"], ["activity", "활동"]].map(([k, l]) => html`<button key=${k} type="button" disabled=${state === "rec"}
          class=${"seg3-b" + (scope === k ? " on" : "") + " s-" + k} onClick=${() => setScope(k)}>${l} ${withPhoto.filter((r) => inScope(r, k)).length}</button>`)}</div>
        <label class="fld"><span>사진 한 장당 ${per.toFixed(1)}초</span>
          <input id="perIn" type="range" min="1.2" max="4" step="0.2" value=${per} disabled=${state === "rec"} onInput=${(e) => setPer(Number(e.target.value))} /></label>
        <p class="text-[13px] text-mist">세로 영상(720×1280)으로 만들어요. 여는 장면 → 사진 ${list.length}장 → 우리 기록 요약 순서이고, 약 ${secs}초 걸려요. 만드는 동안 이 화면을 켜 두세요.</p>
        ${state === "rec" && html`<div class="grid gap-1.5"><div class="bar"><i style=${{ width: Math.round(prog * 100) + "%" }}></i></div>
          <span class="text-[12px] text-mist mono">${Math.round(prog * 100)}% · 녹화 중</span></div>`}
        ${state === "error" && html`<div class="err">${err}</div>`}
        <button type="button" class="btn-save" disabled=${!list.length || state === "rec"} onClick=${run}>
          <${Icon} name=${state === "rec" ? "Loader2" : "Film"} size=${18} className=${state === "rec" ? "animate-spin" : ""} />
          ${state === "rec" ? "영상 만드는 중…" : list.length ? `사진 ${list.length}장으로 영상 만들기` : "사진이 있는 기록이 필요해요"}</button>
      </div>` : html`<div class="grid gap-3">
        <video src=${out.url} controls playsInline class="w-full rounded-xl border-2 border-[#2FA463] bg-black max-h-[60vh]"></video>
        <div class="grid grid-cols-2 gap-2">
          <button type="button" class="btn-save" onClick=${() => saveFile(out.name, out.blob)}><${Icon} name="Download" size=${17} />영상 저장</button>
          <button type="button" class="btn-primary" onClick=${async () => { if (!(await shareFile(out.name, out.blob))) saveFile(out.name, out.blob); }}><${Icon} name="Share2" size=${17} />공유</button>
        </div>
        <p class="text-[12px] text-mist">${out.ext === "webm" ? "WebM 형식이에요. 카카오톡·유튜브에는 그대로 올라가요. 한글·PPT에 넣으려면 MP4로 변환하세요." : "MP4 형식이라 휴대폰·PPT에서 바로 열려요."} · ${out.seconds}초</p>
        <button type="button" class="btn-ghost justify-center" onClick=${() => setState("idle")}>다시 만들기</button>
      </div>`}
    </div>
  </div>`;
}

      <h2 class="pill-h justify-self-start"><${Icon} name="Download" size=${17} />보고서용 데이터</h2>

          <${Icon} name="Globe" size=${20} className="text-photon" /><span><b>GeoJSON</b><small>QGIS · 구글 어스용 좌표</small></span></button>
        <button type="button" class="exp" disabled=${!real.length && !acts.length} onClick=${() => saveFile(`에코쌤즈_백업_${today()}.json`, JSON.stringify(real.concat(acts.map(({ raw, ...a }) => a))), "application/json")}>
          <${Icon} name="HardDriveDownload" size=${20} className="text-photon" /><span><b>내 기록 보내기 (JSON)</b><small>식물 기록 + 활동 사진 · 팀원에게 공유</small></span></button>

function startPos(mode, me, gps, picked) {
  if (picked) return picked;
  if (mode === "solo") { const hm = getHome(me); return { lat: hm.lat, lng: hm.lng, accuracy: null, source: "home" }; }
  return gps ? { lat: gps.lat, lng: gps.lng, accuracy: gps.accuracy, source: "gps" } : null;
}
function RecordModal({ draft, researcher, weather, settings, gps, onClose, onSave, onOpenSettings }) {
  const [mode, setModeS] = useState(draft.mode || "team");
  const [pos, setPos] = useState(() => startPos(draft.mode || "team", researcher, gps, draft.pos));
  const [raw, setRaw] = useState(null);
  const [framed, setFramed] = useState(null);
  const [ai, setAi] = useState(null), [aiState, setAiState] = useState("idle"), [aiErr, setAiErr] = useState("");
  const [saving, setSaving] = useState(false);
  const home = getHome(researcher);
  const [f, setF] = useState({ koreanName: "", scientificName: "", growthForm: "초본", psType: "C3", lai: "", notes: "", place: (draft.mode === "solo") ? home.label : "" });
  const camRef = useRef(null), galRef = useRef(null), tsRef = useRef(Date.now());
  const w = weather || { temp: null, rh: null, cloud: null, sw: 0, ppfd: 0, par: 0 };
  const m = MODES[mode];
  const est = useMemo(() => M.estimate({ sw: w.sw, temp: w.temp, rh: w.rh, psType: f.psType, growthForm: f.growthForm,
    lai: f.lai === "" ? undefined : Number(f.lai) }), [w, f.psType, f.growthForm, f.lai]);
  const meta = { mode, researcher, ts: tsRef.current, name: f.koreanName.trim(), sci: f.scientificName.trim(), place: f.place.trim() || m.place };
  const setMode = (k) => {
    setModeS(k);
    if (!draft.pos) setPos(startPos(k, researcher, gps, null));
    setF((q) => ({ ...q, place: k === "solo" ? (q.place && q.place !== "" && q.place !== MODES.team.place ? q.place : home.label) : (q.place === home.label ? "" : q.place) }));
  };
  useEffect(() => { if (!pos && gps && mode === "team") setPos({ lat: gps.lat, lng: gps.lng, accuracy: gps.accuracy, source: "gps" }); }, [gps]);
  useEffect(() => {
    if (!raw) { setFramed(null); return; }
    let live = true; const t = setTimeout(() => { EM.composeFrame(raw, meta).then((d) => { if (live) setFramed(d); }, () => {}); }, 250);
    return () => { live = false; clearTimeout(t); };
  }, [raw, mode, meta.name, meta.sci, meta.place]);

  const onFile = async (e) => {
    const file = e.target.files && e.target.files[0]; e.target.value = ""; if (!file) return;
    try { tsRef.current = Date.now(); setRaw(await resizeImage(file, 1280, 0.86)); setAi(null); setAiState("idle"); }
    catch (er) { setAiErr("사진을 읽지 못했어요. 다른 사진으로 시도하세요."); setAiState("error"); }
  };
  const p = pos || { lat: DEFAULT_CENTER[0], lng: DEFAULT_CENTER[1], source: "default", accuracy: null };
  const runAI = async () => {
    if (!settings.apiKey) { onOpenSettings(); return; }
    setAiState("loading"); setAiErr("");
    try {
      const o = await analyzePlant({ apiKey: settings.apiKey, model: settings.model, dataUrl: raw, weather: w, lat: p.lat, lng: p.lng, mode });
      setAi(o); setAiState("ok");
      setF((q) => ({ ...q, koreanName: o.koreanName || q.koreanName, scientificName: o.scientificName || q.scientificName, growthForm: o.growthForm, psType: o.photosynthesisType,
        lai: o.carbonFixationEst && Number(o.carbonFixationEst.laiEstimate) > 0 ? String(M.clamp(Number(o.carbonFixationEst.laiEstimate), 0.1, 10)) : q.lai }));
    } catch (er) { setAiState("error"); setAiErr(er.message || String(er)); }
  };
  const preview = { id: "draft", ts: tsRef.current, mode, researcher, lat: p.lat, lng: p.lng, ai, weather: w, model: est,
    koreanName: f.koreanName, scientificName: f.scientificName, confidence: ai ? ai.confidence : null, growthForm: f.growthForm, psType: f.psType };
  const canSave = !!(f.koreanName.trim() || raw) && !saving;
  const save = async () => {
    setSaving(true);
    let photo = null;
    if (raw) { try { photo = await EM.composeFrame(raw, meta); } catch (e) { photo = raw; } }
    onSave({ ...preview, id: uid(), photo, place: meta.place, accuracy: p.accuracy ?? null, source: p.source, lai: est.lai, notes: f.notes.trim(),
      weather: { temp: w.temp, rh: w.rh, cloud: w.cloud, sw: w.sw, ppfd: w.ppfd, par: w.par } });
  };
  const srcLabel = { gps: `내 위치(GPS) ±${Math.round(p.accuracy || 0)}m`, map: "지도에서 콕 찍은 자리", home: `우리 동네 기본 위치 · ${home.label}`, default: "지도를 눌러 위치를 찍어 주세요" }[p.source];

  return html`<div class="modal-bg" onClick=${onClose}>
    <div class="modal" role="dialog" aria-modal="true" aria-label="새 식물 기록" onClick=${(e) => e.stopPropagation()} style=${{ borderColor: m.color }}>
      <div class="flex items-center gap-2 mb-3">
        <div class="seg3 flex-1">
          ${["solo", "team"].map((k) => html`<button key=${k} type="button" class=${"seg3-b" + (mode === k ? " on" : "") + " s-" + k} onClick=${() => setMode(k)}>
            ${MODES[k].label} · ${k === "solo" ? "우리 동네" : "학교"}</button>`)}
        </div>
        <button type="button" class="icon-btn" onClick=${onClose} aria-label="닫기"><${Icon} name="X" size=${18} /></button>
      </div>
      <div class="grid gap-2">
        <${Label}>발견 위치 · 지도를 누르거나 핀을 끌어 콕 찍어요</${Label}>
        <${LocPicker} pos=${pos} onPick=${setPos} color=${rColor(researcher)} />
        <div class="loc-row">
          <span class="flex items-center gap-1.5 min-w-0 flex-wrap"><${Icon} name="MapPin" size=${15} /><span>${srcLabel}</span>
            <span class="mono text-mist text-[11px]">${p.lat.toFixed(6)}, ${p.lng.toFixed(6)}</span></span>
          <span class="flex gap-1.5 shrink-0">
            ${gps && html`<button type="button" class="mini-btn" onClick=${() => setPos({ lat: gps.lat, lng: gps.lng, accuracy: gps.accuracy, source: "gps" })}><${Icon} name="LocateFixed" size=${13} />내 위치</button>`}
            ${mode === "solo" && html`<button type="button" class="mini-btn" onClick=${() => setPos({ lat: home.lat, lng: home.lng, accuracy: null, source: "home" })}><${Icon} name="House" size=${13} />우리 동네</button>`}
          </span>
        </div>
        ${p.source === "gps" && p.accuracy > 8 && html`<p class="text-[12px] text-mist">GPS 오차가 약 ${Math.round(p.accuracy)}m예요. 위성사진을 크게 확대해서 실제 자리를 다시 콕 찍으면 더 정확해요.</p>`}
      </div>
      <div class="flex flex-wrap gap-x-3 gap-y-1 text-[12px] text-mist mb-4 mt-2">

        <span class="mono">${weather ? `${fix(w.temp)}℃ · ${fix(w.sw, 0)} W/m² · PAR ${w.par}` : "기상 정보 없음"}</span>

      <div class="grid gap-4">

              <button type="button" class="icon-btn absolute top-2 right-2" onClick=${() => { setRaw(null); setAi(null); setAiState("idle"); }} aria-label="사진 지우기"><${Icon} name="Trash2" size=${16} /></button>
            </div>
            <p class="text-[12px] text-mist mt-1.5 text-center">저장하면 이 프레임 그대로 사진첩·영상에 남아요.</p>`
          : html`<div class="grid grid-cols-2 gap-2">
              <button type="button" class="drop" onClick=${() => camRef.current.click()}><${Icon} name="Camera" size=${24} />촬영</button>
              <button type="button" class="drop" onClick=${() => galRef.current.click()}><${Icon} name="ImagePlus" size=${24} />앨범에서 선택</button>

          <input ref=${camRef} id="camIn" type="file" accept="image/*" capture="environment" class="hidden" onChange=${onFile} />

          ${raw && html`<button type="button" class="btn-primary w-full mt-2" onClick=${runAI} disabled=${aiState === "loading"}>
            <${Icon} name=${aiState === "loading" ? "Loader2" : "ScanSearch"} size=${18} className=${aiState === "loading" ? "animate-spin" : ""} />

  const isNew = !item;
  const [files, setFiles] = useState([]); // [{raw, ts}]
  const [title, setTitle] = useState(item ? item.title || "" : "");
  const [place, setPlace] = useState(item ? item.place || "" : "");
  const [people, setPeople] = useState(item ? item.people || [] : [me]);
  const [notes, setNotes] = useState(item ? item.notes || "" : "");
  const [when, setWhen] = useState(item ? toLocalInput(item.ts) : "");
  const [busy, setBusy] = useState(false), [ask, setAsk] = useState(false), [err, setErr] = useState("");
  const [prev, setPrev] = useState(item ? item.photo : null);
  const inRef = useRef(null), camRef = useRef(null);
  const first = isNew ? files[0] : (item.raw ? { raw: item.raw, ts: item.ts } : null);
  const metaFor = (ts) => ({ mode: "activity", researcher: me, ts, name: title.trim() || "우리의 활동", place: place.trim(), people });
  useEffect(() => {
    if (!first) { if (isNew) setPrev(null); return; }
    const ts = fromLocalInput(when) || first.ts;
    let live = true; const t = setTimeout(() => { EM.composeFrame(first.raw, metaFor(ts)).then((d) => { if (live) setPrev(d); }, () => {}); }, 250);
    return () => { live = false; clearTimeout(t); };
  }, [first && first.raw, when, title, place, people.join(",")]);

  const pick = async (e) => {
    const list = [...(e.target.files || [])]; e.target.value = ""; if (!list.length) return;
    setBusy(true); setErr("");
    try {
      const out = [];
      for (const f of list.slice(0, 30)) {
        const ts = (await EM.exifDate(f)) || f.lastModified || Date.now();
        out.push({ raw: await resizeImage(f, 1280, 0.85), ts });
      }
      out.sort((a, b) => a.ts - b.ts);
      setFiles(out); setWhen(toLocalInput(out[0].ts));
    } catch (er) { setErr("사진을 읽지 못했어요. 다른 사진으로 시도하세요."); }
    setBusy(false);
  };
  const togglePerson = (n) => setPeople((ps) => ps.includes(n) ? ps.filter((x) => x !== n) : RESEARCHERS.map((r) => r.name).filter((x) => ps.includes(x) || x === n));
  const save = async () => {
    setBusy(true);
    try {
      const edited = fromLocalInput(when);
      if (isNew) {
        // 첫 장 날짜를 고치면 나머지도 같은 만큼 옮겨서 순서를 지켜요
        const shift = edited && files.length ? edited - files[0].ts : 0;
        const list = [];
        for (const f of files) {
          const ts = f.ts + shift;
          list.push({ id: uid(), kind: "activity", ts, title: title.trim(), place: place.trim(), people, notes: notes.trim(), researcher: me, raw: f.raw,
            photo: await EM.composeFrame(f.raw, metaFor(ts)) });
        }
        onSave(list);
      } else {
        const ts = edited || item.ts;
        const raw = item.raw || item.photo;
        onSave([{ ...item, ts, title: title.trim(), place: place.trim(), people, notes: notes.trim(), raw,
          photo: item.raw ? await EM.composeFrame(raw, metaFor(ts)) : item.photo }]);
      }
    } catch (e) { setErr("저장하지 못했어요. 다시 시도해 주세요."); setBusy(false); }
  };
  return html`<div class="modal-bg" onClick=${busy ? null : onClose}>
    <div class="modal" role="dialog" aria-modal="true" aria-label="활동 사진" onClick=${(e) => e.stopPropagation()} style=${{ borderColor: MODES.activity.color }}>
      <div class="flex items-center gap-2 mb-3"><${Icon} name="Users" size=${20} className="text-amber" />
        <h2 class="font-display text-[20px] text-snow">${isNew ? "활동 사진 올리기" : "활동 사진 고치기"}</h2>
        <button type="button" class="icon-btn ml-auto" onClick=${onClose} aria-label="닫기" disabled=${busy}><${Icon} name="X" size=${18} /></button></div>
      <div class="grid gap-4">
        ${isNew && !files.length ? html`<div class="grid grid-cols-2 gap-2">
            <button type="button" class="drop drop-act" onClick=${() => camRef.current.click()} disabled=${busy}><${Icon} name="Camera" size=${24} />지금 찍기</button>
            <button type="button" class="drop drop-act" onClick=${() => inRef.current.click()} disabled=${busy}><${Icon} name="Images" size=${24} />앨범에서 여러 장</button>
          </div>` : null}
        <input ref=${inRef} id="actIn" type="file" accept="image/*" multiple class="hidden" onChange=${pick} />
        <input ref=${camRef} id="actCam" type="file" accept="image/*" capture="environment" class="hidden" onChange=${pick} />
        ${busy && !prev ? html`<div class="frame-wait p-6 text-center">사진을 읽고 날짜를 찾는 중…</div>` : null}
        ${prev && html`<div class="grid gap-1.5">
          <div class="frame-prev">${html`<img src=${prev} alt="날짜 도장이 찍힌 활동 사진 미리보기" />`}</div>
          ${isNew && files.length > 1 && html`<div class="act-thumbs">${files.map((f, i) => html`<img key=${i} src=${f.raw} alt="" />`)}</div>`}
          <p class="text-[12px] text-mist text-center">${isNew && files.length > 1 ? `${files.length}장 모두 같은 제목으로, 각자 찍은 시각이 도장으로 찍혀요.` : "날짜를 고치면 도장도 바로 바뀌어요."}</p>
        </div>`}
        <label class="fld"><span>날짜와 시각 ${isNew && files.length ? "(사진에서 자동으로 읽었어요)" : ""}</span>
          <input id="actWhen" type="datetime-local" value=${when} onInput=${(e) => setWhen(e.target.value)} /></label>
        ${isNew && files.length > 1 && html`<p class="text-[12px] text-mist -mt-3">첫 장 날짜를 고치면 나머지 사진도 같은 만큼 함께 옮겨져요.</p>`}
        <label class="fld"><span>활동 이름</span><input id="actTitle" value=${title} onInput=${(e) => setTitle(e.target.value)} placeholder="예: 1차 정기 모임, 학교 화단 탐사, 하천 생태 산책" /></label>
        <label class="fld"><span>장소</span><input id="actPlace" value=${place} onInput=${(e) => setPlace(e.target.value)} placeholder="예: 송례중 과학실, 장지천" /></label>
        <div><${Label}>함께한 사람</${Label}><div class="flex flex-wrap gap-1.5">${RESEARCHERS.map((r) => html`<${Chip} key=${r.name} on=${people.includes(r.name)} color=${r.color} onClick=${() => togglePerson(r.name)}>
          <${Dot} color=${people.includes(r.name) ? "#fff" : r.color} size=${7} />${r.name}</${Chip}>`)}</div></div>
        <label class="fld"><span>메모</span><textarea id="actNote" rows="2" value=${notes} onInput=${(e) => setNotes(e.target.value)} placeholder="무엇을 했고 무엇을 느꼈는지"></textarea></label>
        ${err && html`<div class="err">${err}</div>`}
        <button type="button" class="btn-save" onClick=${save} disabled=${busy || (isNew && !files.length)}
          style=${{ background: MODES.activity.color, borderColor: MODES.activity.deep, boxShadow: `0 4px 0 ${MODES.activity.deep}` }}>
          <${Icon} name="Save" size=${18} />${busy && (files.length || !isNew) ? "날짜 도장 찍는 중…" : isNew ? `활동 사진 ${files.length || ""}장 저장` : "고친 내용 저장"}</button>
        ${!isNew && html`<div class="flex gap-2 flex-wrap">
          <button type="button" class="btn-ghost" onClick=${async () => { const b = await (await fetch(item.photo)).blob(); const n = `에코쌤즈_활동_${fmtDay(item.ts).replace(/\s/g, "")}.jpg`; if (!(await shareFile(n, b))) saveFile(n, b); }}>
            <${Icon} name="Download" size=${15} />사진 저장</button>
          ${!ask ? html`<button type="button" class="btn-ghost ml-auto text-rose-600" onClick=${() => setAsk(true)}><${Icon} name="Trash2" size=${15} />삭제</button>`
            : html`<div class="ml-auto flex items-center gap-2"><span class="text-[13px] text-rose-700">지울까요?</span>
              <button type="button" class="btn-ghost" onClick=${() => setAsk(false)}>취소</button><button type="button" class="btn-danger" onClick=${() => onDelete(item.id)}>삭제</button></div>`}
        </div>`}
      </div>
    </div>
  </div>`;
}

/* ---------- 앱 ---------- */
function App() {
  const saved = store.get(LS_SET, {});
  const [settings, setSettings] = useState({ apiKey: saved.apiKey || "", model: saved.model || DEFAULT_MODEL });
  const [auth, setAuth] = useState(() => { store.del("ecossam.v1.auth"); const a = store.get(LS_AUTH, null); return a && RESEARCHERS.some((r) => r.name === a.name) ? a : null; });
  const me = auth ? auth.name : RESEARCHERS[0].name;
  const [records, setRecords] = useState([]);
  const [acts, setActs] = useState([]);
  const [actEdit, setActEdit] = useState(null);
  const [loaded, setLoaded] = useState(false);
  const [tab, setTabS] = useState(() => { const hsh = (location.hash || "").slice(1); return TABS.some((t) => t.id === hsh) ? hsh : "today"; });
  const [weather, setWeather] = useState(null), [wState, setWState] = useState("idle"), [wErr, setWErr] = useState("");
  const [gps, setGps] = useState(null);
  const [follow, setFollow] = useState(false);
  const [draft, setDraft] = useState(null);
  const [openId, setOpenId] = useState(null);
  const [showSettings, setShowSettings] = useState(false);
  const [toast, setToast] = useState("");
  const lastWx = useRef(null), gpsRef = useRef(null); gpsRef.current = gps;

  const say = (m) => { setToast(m); clearTimeout(say.t); say.t = setTimeout(() => setToast(""), 2600); };
  const setTab = (t) => { setTabS(t); try { history.replaceState(null, "", "#" + t); } catch (e) {} window.scrollTo(0, 0); };
  useEffect(() => { const fn = () => { const hsh = (location.hash || "").slice(1); if (TABS.some((t) => t.id === hsh)) setTabS(hsh); };
    window.addEventListener("hashchange", fn); return () => window.removeEventListener("hashchange", fn); }, []);

  // 기록 불러오기 (IndexedDB) + 이전 버전 기록 옮기기
  useEffect(() => { (async () => {
    let all = await db.all();
    const old = store.get(LS_OLD, null);
    if (old && Array.isArray(old)) { for (const r of old) { if (!r.sample) await db.put({ mode: "team", ...r }); } store.del(LS_OLD); all = await db.all(); }
    if (!all.length && !store.get("ecossam.v2.seeded", false)) { for (const r of sampleRecords()) await db.put(r); store.set("ecossam.v2.seeded", true); all = await db.all(); }
    all.sort((a, b) => b.ts - a.ts);
    setRecords(all.filter((r) => r.kind !== "activity")); setActs(all.filter((r) => r.kind === "activity")); setLoaded(true);
  })(); }, []);

  const loadWx = useCallback(async (lat, lng, fromGps) => {
    setWState("loading");
    try { const w = await fetchWeather(lat, lng); setWeather(w); setWState("ok"); lastWx.current = { lat, lng, t: Date.now(), gps: !!fromGps }; }
    catch (e) { setWState("error"); setWErr(e.name === "AbortError" ? "기상 서버가 응답하지 않아요. 잠시 뒤 새로 고침을 눌러 주세요." : "기상 정보를 불러오지 못했어요. 인터넷 연결을 확인하세요."); }
  }, []);
  // 처음엔 내 우리 동네 기준, GPS가 잡히면 현재 위치 기준
  useEffect(() => { if (!auth) return; const hm = getHome(auth.name); loadWx(hm.lat, hm.lng, false); }, [auth && auth.name]);
  useEffect(() => {
    if (!navigator.geolocation) return;
    const id = navigator.geolocation.watchPosition((q) => setGps({ lat: q.coords.latitude, lng: q.coords.longitude, accuracy: q.coords.accuracy }),
      () => {}, { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 });
    return () => navigator.geolocation.clearWatch(id);
  }, []);
  useEffect(() => {
    if (!gps) return; const L0 = lastWx.current;
    const moved = !L0 || !L0.gps || Math.hypot((gps.lat - L0.lat) * 111000, (gps.lng - L0.lng) * 88000) > 500;
    if (moved || Date.now() - L0.t > 600000) loadWx(gps.lat, gps.lng, true);
  }, [gps]);
  useEffect(() => { const t = setInterval(() => { const q = gpsRef.current; if (q) loadWx(q.lat, q.lng, true); else { const hm = getHome(me); loadWx(hm.lat, hm.lng, false); } }, 600000); return () => clearInterval(t); }, [me]);

  const login = (name) => { const a = { name, at: Date.now() }; store.set(LS_AUTH, a); setAuth(a); setTab("today"); };
  const logout = () => { store.del(LS_AUTH); setAuth(null); setDraft(null); setOpenId(null); setActEdit(null); window.scrollTo(0, 0); };
  const addRecord = (mode) => setDraft({ mode, pos: null });
  const onMapPick = useCallback((lat, lng) => { setOpenId(null); setDraft({ mode: "team", pos: { lat, lng, source: "map", accuracy: null } }); }, []);
  const saveRecord = async (rec) => {
    const ok = await db.put(rec);
    setRecords((rs) => [rec, ...rs]); setDraft(null);
    say(ok ? `${MODES[rec.mode].label} 기록 저장 · ${rec.koreanName || "식물"}` : "저장 공간이 부족해요. 아카이브에서 백업 후 정리하세요.");
    setTab(rec.mode === "solo" ? "solo" : "team");
  };
  const saveActs = async (list) => {
    for (const a of list) await db.put(a);
    setActs((as) => { const mm = new Map(as.map((x) => [x.id, x])); list.forEach((a) => mm.set(a.id, a)); return [...mm.values()].sort((a, b) => b.ts - a.ts); });
    setActEdit(null); say(list.length > 1 ? `활동 사진 ${list.length}장을 올렸어요` : "활동 사진을 저장했어요");
  };
  const deleteAct = async (id) => { await db.del(id); setActs((as) => as.filter((a) => a.id !== id)); setActEdit(null); say("활동 사진을 지웠어요"); };
  const deleteRecord = async (id) => { await db.del(id); setRecords((rs) => rs.filter((r) => r.id !== id)); setOpenId(null); say("기록을 지웠어요"); };
  const clearSamples = async () => { for (const r of records.filter((x) => x.sample)) await db.del(r.id); setRecords((rs) => rs.filter((r) => !r.sample)); say("예시를 지웠어요"); };
  const importJSON = (file) => {
    const rd = new FileReader();
    rd.onload = async (e) => {
      try {
        const arr = JSON.parse(e.target.result); if (!Array.isArray(arr)) throw 0;
        const ok = arr.filter((o) => o && o.id && o.kind !== "activity" && typeof o.lat === "number" && o.weather && o.model).map((o) => ({ mode: "team", ...o }));
        const okA = arr.filter((o) => o && o.id && o.kind === "activity" && o.photo);
        for (const o of ok.concat(okA)) await db.put(o);
        const merge = (rs, add) => { const mm = new Map(rs.map((r) => [r.id, r])); add.forEach((o) => mm.set(o.id, o)); return [...mm.values()].sort((a, b) => b.ts - a.ts); };
        setRecords((rs) => merge(rs, ok)); setActs((as) => merge(as, okA));
        say(`식물 ${ok.length}건 · 활동 사진 ${okA.length}장을 합쳤어요`);
      } catch (_) { say("합치기 실패: 이 앱에서 보낸 JSON 파일인지 확인하세요"); }
    };
    rd.readAsText(file);
  };

  if (!auth) return html`<${Gate} onLogin=${login} />`;
  const openRec = records.find((r) => r.id === openId);
  const counts = { solo: records.filter((r) => r.mode === "solo" && r.researcher === me).length, team: records.filter((r) => r.mode === "team").length, activity: acts.length };

  return html`<div class=${"app tab-is-" + tab}>
    ${tab === "today"
      ? html`<${Hero}><div class="hero-top"><span class="hero-me"><${Dot} color=${rColor(me)} size=${10} />${me} 님 · ${getHome(me).label}</span>
          <span class="flex gap-1.5"><button type="button" class=${"strip-btn" + (settings.apiKey ? " on" : "")} onClick=${() => setShowSettings(true)} aria-label="AI 분석 설정"><${Icon} name="Settings2" size=${17} /></button>
          <button type="button" class="strip-btn" onClick=${logout} aria-label="로그아웃"><${Icon} name="LogOut" size=${17} /></button></span></div></${Hero}>`
      : html`<${TopStrip} tab=${tab} name=${me} hasKey=${!!settings.apiKey} onSettings=${() => setShowSettings(true)} onLogout=${logout} />`}
    <main class="wrap pb-28">
      ${!loaded ? html`<div class="boot" style=${{ minHeight: "30vh" }}>기록을 불러오는 중…</div>`
        : tab === "today" ? html`<${TodayView} me=${me} records=${records} weather=${weather} wState=${wState} wErr=${wErr} gps=${!!gps}
            onRefresh=${() => { const q = gps; if (q) loadWx(q.lat, q.lng, true); else { const hm = getHome(me); loadWx(hm.lat, hm.lng, false); } }} onAdd=${addRecord} onOpen=${setOpenId} goTab=${setTab} />`
        : tab === "solo" ? html`<${SoloView} me=${me} records=${records} gps=${gps} onAdd=${addRecord} onOpen=${setOpenId} say=${say} />`
        : tab === "team" ? html`<${TeamView} records=${records} onAdd=${addRecord} onOpen=${setOpenId} />`
        : tab === "activity" ? html`<${ActivityView} me=${me} acts=${acts} onAdd=${() => setActEdit({ isNew: true })} onOpen=${(a) => setActEdit(a)} />`
        : tab === "map" ? html`<${MapView} records=${records} gps=${gps} follow=${follow} setFollow=${setFollow} onMapPick=${onMapPick} onOpen=${setOpenId} openId=${openId} />`
        : html`<${ArchiveView} records=${records} acts=${acts} onOpen=${setOpenId} onOpenAct=${(a) => setActEdit(a)} onClearSamples=${clearSamples} onImport=${importJSON} />`}
      <footer class="text-center text-[11px] text-mist leading-relaxed mt-6">기후행동 실천모임 에코쌤즈 · 이정연 · 신민화 · 이귀리 · 정종화<br/>기상 Open-Meteo · 지도 © OpenStreetMap, CARTO · 탄소 고정 값은 대표 계수 기반 추정치</footer>
    </main>
    <${TabBar} tab=${tab} setTab=${setTab} counts=${counts} />
    ${draft && html`<${RecordModal} draft=${draft} researcher=${me} weather=${weather} settings=${settings} gps=${gps}
      onClose=${() => setDraft(null)} onSave=${saveRecord} onOpenSettings=${() => setShowSettings(true)} />`}
    ${actEdit && html`<${ActivityModal} me=${me} item=${actEdit.isNew ? null : actEdit} onClose=${() => setActEdit(null)} onSave=${saveActs} onDelete=${deleteAct} />`}
    ${openRec && !draft && html`<${DetailModal} rec=${openRec} me=${me} onClose=${() => setOpenId(null)} onDelete=${deleteRecord} />`}
    ${showSettings && html`<${SettingsModal} settings=${settings} onClose=${() => setShowSettings(false)}
      onSave=${(s) => { setSettings(s); store.set(LS_SET, { ...store.get(LS_SET, {}), ...s }); setShowSettings(false); say(s.apiKey ? "AI 설정을 저장했어요" : "API 키를 지웠어요"); }} />`}
    ${toast && html`<div class="toast" role="status">${toast}</div>`}
  </div>`;
}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);

}
</script>
</body>
</html>
