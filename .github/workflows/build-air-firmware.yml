name: 공기 보드 펌웨어 빌드
on:
  push:
    branches: [air-firmware]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: ESP32 보드 패키지 설치
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
      - name: 빌드 (ESP32 / S3 / C3)
        run: |
          set -e
          for t in esp32 esp32s3 esp32c3; do
            arduino-cli compile --fqbn esp32:esp32:$t --output-dir out/$t firmware/EZ_CO2_WiFi
          done
          ls -la out/*
      - name: 합친 바이너리를 브랜치에 저장
        run: |
          mkdir -p bin
          for t in esp32 esp32s3 esp32c3; do cp out/$t/EZ_CO2_WiFi.ino.merged.bin bin/$t.bin; done
          ls -la bin
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add bin
          git commit -m "빌드 결과 (merged bin) [skip ci]" || echo "변경 없음"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: air-firmware
          path: out/
